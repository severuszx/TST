<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>T显编译器 - The Slow Tide</title>
<script>
(function(){
var mode=localStorage.getItem('tst-theme');
if(mode!=='dark' && mode!=='light'){ mode='light'; }
document.documentElement.setAttribute('data-theme',mode);
})();
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
--bg:#f3f5f8;
--text:#1f2937;
--text-secondary:#5b6675;
--border:#e2e8f0;
--card:#ffffff;
--hover:#eef2f7;
--header-bg:rgba(255,255,255,.92);
--primary:#0f172a;
--accent:#52525b;
--accent-soft:rgba(82,82,91,.1);
--shadow:0 4px 14px rgba(15,23,42,.07);
}
html[data-theme="dark"]{
--bg:#111113;
--text:#e5e5e7;
--text-secondary:#9a9aa0;
--border:#26262b;
--card:#18181b;
--hover:#222226;
--header-bg:rgba(17,17,19,.92);
--primary:#f4f4f5;
--accent:#a1a1aa;
--accent-soft:rgba(161,161,170,.14);
--shadow:0 4px 14px rgba(0,0,0,.5);
}
html[data-theme="dark"] .btn-primary{background:#71717a;}
body{
background:var(--bg);
color:var(--text);
font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
line-height:1.65;
}
.container{max-width:1140px;margin:0 auto;padding:0 16px;}
a{color:var(--accent);text-decoration:none;}
button{font-family:inherit;}

/* ===== 顶部导航 ===== */
.site-header{
position:sticky;top:0;z-index:100;
background:var(--header-bg);
backdrop-filter:blur(10px);
border-bottom:1px solid var(--border);
}
.header-inner{
display:flex;align-items:center;gap:18px;
min-height:62px;flex-wrap:wrap;
}
.logo{
font-size:20px;font-weight:700;color:var(--primary);
display:flex;align-items:center;gap:8px;white-space:nowrap;
}
.logo-img{
width:34px;height:34px;border-radius:4px;
object-fit:cover;flex:none;display:block;
}
html[data-theme="dark"] .logo-img{filter:invert(1);}
.main-nav{
display:flex;gap:2px;flex:1;flex-wrap:wrap;
}
.nav-link{
padding:8px 12px;border-radius:6px;border:none;background:transparent;
color:var(--text);font-size:14px;cursor:pointer;white-space:nowrap;
text-decoration:none;
}
.nav-link:hover{background:var(--hover);text-decoration:none;}
.nav-link.active{background:var(--accent-soft);color:var(--accent);font-weight:600;}
.header-right{
display:flex;align-items:center;gap:8px;margin-left:auto;flex-wrap:wrap;
}
.btn{
padding:8px 14px;border-radius:6px;border:1px solid var(--border);
background:var(--card);color:var(--text);cursor:pointer;font-size:14px;white-space:nowrap;
}
.btn:hover{background:var(--hover);}
.btn-primary{
background:#52525b;
border:none;color:#fff;font-weight:600;
}
.btn-primary:hover{filter:brightness(1.06);}
.theme-toggle{
position:relative;width:54px;height:28px;flex:none;
border:1px solid var(--border);background:var(--card);
border-radius:14px;cursor:pointer;padding:0;overflow:hidden;
}
.theme-toggle .tt-ic{
position:absolute;top:50%;transform:translateY(-50%);
font-size:13px;line-height:1;pointer-events:none;
}
.theme-toggle .tt-sun{left:8px;opacity:.75;}
.theme-toggle .tt-moon{right:8px;opacity:.75;}
.theme-toggle .tt-thumb{
position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;
background:var(--accent);display:flex;align-items:center;justify-content:center;
font-size:11px;color:#fff;transition:left .28s cubic-bezier(.4,0,.2,1),background-color .28s;
}
html[data-theme="dark"] .theme-toggle .tt-thumb{left:29px;}
body,.site-header,.card,.btn,.theme-toggle{
transition:background-color .3s ease,color .3s ease,border-color .3s ease;
}

/* ===== 页面 ===== */
.section{padding:26px 0;}
.section-title{
display:flex;align-items:center;gap:10px;
font-size:21px;font-weight:700;margin-bottom:18px;color:var(--primary);
}
.section-title::before{
content:'';width:5px;height:22px;border-radius:0;background:var(--accent);
}
.tool-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;}
.tool-card{
background:var(--card);border:1px solid var(--border);border-radius:10px;
padding:20px;box-shadow:var(--shadow);cursor:pointer;
transition:transform .2s ease,box-shadow .2s ease;
}
.tool-card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.1);}
.tool-card h3{font-size:17px;margin-bottom:8px;}
.tool-card p{font-size:14px;color:var(--text-secondary);}

/* ===== 编译器 ===== */
.compiler-wrap{display:none;}
.compiler-wrap.show{display:block;}
.compiler-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media(max-width:760px){.compiler-grid{grid-template-columns:1fr;}}
.card{
background:var(--card);border:1px solid var(--border);border-radius:10px;
padding:18px;box-shadow:var(--shadow);
}
.card h3{font-size:16px;margin-bottom:14px;}
.form-row{margin-bottom:12px;}
.form-row label{display:block;font-size:13px;color:var(--text-secondary);margin-bottom:5px;}
.form-row input[type="text"],.form-row textarea,.form-row select{
width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:6px;
background:var(--bg);color:var(--text);font-size:14px;outline:none;font-family:inherit;
}
.form-row input:focus,.form-row textarea:focus,.form-row select:focus{border-color:var(--accent);}
.form-row textarea{min-height:70px;resize:vertical;}
.color-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;}
.color-chip{
width:30px;height:30px;border-radius:6px;cursor:pointer;
border:2px solid transparent;transition:border-color .2s;
}
.color-chip.selected{border-color:var(--primary);box-shadow:0 0 0 2px var(--bg);}
.style-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;}
.style-btn{
padding:6px 14px;border:1px solid var(--border);border-radius:6px;
background:var(--bg);color:var(--text);cursor:pointer;font-size:13px;
}
.style-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.preview-box{
background:#1a1a1a;color:#fff;padding:16px;border-radius:8px;
min-height:90px;font-size:18px;margin-top:10px;
word-break:break-all;white-space:pre-wrap;
}
.output-box{
background:var(--bg);border:1px solid var(--border);border-radius:6px;
padding:12px;font-family:ui-monospace,Consolas,monospace;font-size:13px;
word-break:break-all;min-height:60px;color:var(--text);white-space:pre-wrap;
}
.btn-row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
.back-btn{margin-bottom:16px;}
.toast-wrap{
position:fixed;left:50%;bottom:34px;transform:translateX(-50%);z-index:300;
}
.toast-item{
background:var(--primary);color:var(--bg);padding:9px 18px;border-radius:6px;
font-size:14px;box-shadow:var(--shadow);
}
.hint{font-size:12px;color:var(--text-secondary);margin-top:6px;}

/* ===== 元素卡片 ===== */
.elem-list{display:flex;flex-direction:column;gap:12px;margin-top:4px;}
.elem-card{
border:1px solid var(--border);border-radius:8px;padding:12px;
background:var(--bg);
}
.elem-head{
display:flex;align-items:center;gap:8px;margin-bottom:10px;
}
.elem-head select{
padding:5px 8px;border:1px solid var(--border);border-radius:6px;
background:var(--card);color:var(--text);font-size:13px;outline:none;font-family:inherit;
}
.elem-del{
margin-left:auto;padding:4px 12px;border:none;border-radius:6px;
background:transparent;color:var(--text-secondary);cursor:pointer;font-size:13px;
}
.elem-del:hover{background:var(--hover);color:var(--text);}
.elem-num{
font-size:13px;font-weight:600;color:var(--accent);min-width:22px;
}
.add-elem{
margin-top:12px;width:100%;padding:10px;border:1px dashed var(--border);
border-radius:8px;background:transparent;color:var(--text-secondary);
cursor:pointer;font-size:14px;
}
.add-elem:hover{background:var(--hover);color:var(--text);}
.hint-line{font-size:12px;color:var(--text-secondary);margin-top:6px;}
</style>
</head>
<body>
<header class="site-header">
<div class="container header-inner">
<div class="logo"><img src="logo.jpg" alt="The Slow Tide" class="logo-img"> The Slow Tide</div>
<nav class="main-nav" id="mainNav">
<button class="nav-link" onclick="location.href='index.html'">首页</button>
<button class="nav-link" onclick="location.href='index.html#notice'">公告</button>
<button class="nav-link active" onclick="location.href='tool.html'">便捷工具</button>
<button class="nav-link" onclick="location.href='profile.html'">我的</button>
</nav>
<div class="header-right">
<button class="nav-link" style="font-size:14px;" onclick="location.href='index.html'">返回官网</button>
<button class="theme-toggle" id="themeToggle" title="切换主题">
<span class="tt-ic tt-sun">☀</span>
<span class="tt-ic tt-moon">☾</span>
<span class="tt-thumb" id="themeThumb"></span>
</button>
</div>
</div>
</header>

<section class="section">
<div class="container">

<!-- 工具列表 -->
<div id="toolList">
<div class="section-title">便捷工具</div>
<div class="tool-grid">
<div class="tool-card" onclick="openCompiler()">
<h3>T显编译器</h3>
<p>生成 Minecraft JSON 文本，支持文本 / 选择器 / 记分板 / 翻译键元素。</p>
</div>
</div>
</div>

<!-- 编译器 -->
<div id="compilerPage" class="compiler-wrap">
<button class="btn back-btn" onclick="backToList()">← 返回工具列表</button>
<div class="section-title">T显编译器</div>

<div class="compiler-grid">
<!-- 编辑区 -->
<div class="card">
<h3>编辑内容</h3>
<div class="form-row">
<label>目标版本</label>
<div class="style-row">
<button class="style-btn active" data-ver="java" onclick="setVersion(this)">Java 版</button>
<button class="style-btn" data-ver="netease" onclick="setVersion(this)">网易版</button>
</div>
</div>
<div class="elem-list" id="elemList"></div>
<button class="add-elem" onclick="addElem()">+ 添加元素</button>
</div>

<!-- 预览区 -->
<div class="card">
<h3>预览</h3>
<div class="preview-box" id="previewBox"></div>
<div class="form-row" style="margin-top:14px;">
<label>JSON 文本（复制到游戏内使用）</label>
<div class="output-box" id="outputBox"></div>
<div class="hint" id="verHint">Java 版：适用于 title / tellraw 命令的 JSON 文本。</div>
</div>
<div class="btn-row">
<button class="btn btn-primary" onclick="copyCode()">复制 JSON</button>
<button class="btn" onclick="resetAll()">重置</button>
</div>
</div>
</div>
</div>

</div>
</section>

<div class="toast-wrap" id="toastWrap"></div>

<script>
const $=s=>document.querySelector(s);
let currentVer='java';

// Java 版颜色名 -> 网易版 § 码
const secCode={
'white':'f','black':'0','dark_blue':'1','dark_green':'2','dark_aqua':'3',
'dark_red':'4','dark_purple':'5','gold':'6','gray':'7','dark_gray':'8',
'blue':'9','green':'a','aqua':'b','red':'c','light_purple':'d','yellow':'e'
};
const styleCode={'bold':'l','italic':'o','underlined':'n','strikethrough':'m'};
const typeNames={'text':'文本','selector':'选择器','score':'记分板','translate':'翻译键'};
const colors=[
['white','#ffffff','白色'],['black','#000000','黑色'],['dark_blue','#0000aa','深蓝'],
['dark_green','#00aa00','深绿'],['dark_aqua','#00aaaa','深青'],['dark_red','#aa0000','深红'],
['dark_purple','#aa00aa','紫色'],['gold','#ffaa00','金色'],['gray','#aaaaaa','灰色'],
['dark_gray','#555555','深灰'],['blue','#5555ff','蓝色'],['green','#55ff55','绿色'],
['aqua','#55ffff','天蓝'],['red','#ff5555','红色'],['light_purple','#ff55ff','粉色'],
['yellow','#ffff55','黄色']
];

// 元素模型：{type, text, selector, scoreName, scoreObj, translate, withText, color, styles:Set}
let elems=[];
let elemId=0;

function newElem(type){
return {
  id:++elemId,
  type:type||'text',
  text:'',
  selector:'@p',
  scoreName:'@p',
  scoreObj:'',
  translate:'',
  withText:'',
  color:'white',
  styles:new Set()
};
}

function showToast(msg){
const w=$('#toastWrap');
const d=document.createElement('div');
d.className='toast-item';
d.textContent=msg;
w.appendChild(d);
setTimeout(()=>d.remove(),2000);
}

function openCompiler(){
$('#toolList').style.display='none';
$('#compilerPage').classList.add('show');
}
function backToList(){
$('#compilerPage').classList.remove('show');
$('#toolList').style.display='block';
}

function setVersion(btn){
currentVer=btn.dataset.ver;
document.querySelectorAll('[data-ver]').forEach(b=>b.classList.toggle('active',b===btn));
const hint=currentVer==='java'
  ?'Java 版：适用于 title / tellraw 命令的 JSON 文本。'
  :'网易版：颜色用 § 格式码（如 §e 金色）嵌入文本，其他类型保留 JSON 结构。';
$('#verHint').textContent=hint;
updateAll();
}

/* ===== 渲染元素列表 ===== */
function renderElems(){
const box=$('#elemList');
box.innerHTML='';
elems.forEach((el,idx)=>{
  const card=document.createElement('div');
  card.className='elem-card';
  const typeRow=document.createElement('div');
  typeRow.className='elem-head';

  const num=document.createElement('span');
  num.className='elem-num';
  num.textContent=(idx+1)+'.';
  typeRow.appendChild(num);

  const sel=document.createElement('select');
  Object.keys(typeNames).forEach(t=>{
    const opt=document.createElement('option');
    opt.value=t;
    opt.textContent=typeNames[t];
    if(t===el.type) opt.selected=true;
    sel.appendChild(opt);
  });
  sel.onchange=()=>{ el.type=sel.value; updateAll(); };
  typeRow.appendChild(sel);

  const del=document.createElement('button');
  del.className='elem-del';
  del.textContent='删除';
  del.onclick=()=>{ elems.splice(idx,1); updateAll(); };
  typeRow.appendChild(del);

  card.appendChild(typeRow);

  // 类型输入区
  if(el.type==='text'){
    const row=document.createElement('div');
    row.className='form-row';
    const lab=document.createElement('label');
    lab.textContent='文字内容';
    const ta=document.createElement('textarea');
    ta.placeholder='输入要显示的文字...';
    ta.value=el.text;
    ta.oninput=()=>{ el.text=ta.value; updateAll(); };
    row.appendChild(lab); row.appendChild(ta);
    card.appendChild(row);
  }else if(el.type==='selector'){
    const row=document.createElement('div');
    row.className='form-row';
    const lab=document.createElement('label');
    lab.textContent='选择器（如 @p、@a、@e[type=zombie]）';
    const inp=document.createElement('input');
    inp.type='text';
    inp.value=el.selector;
    inp.oninput=()=>{ el.selector=inp.value; updateAll(); };
    row.appendChild(lab); row.appendChild(inp);
    card.appendChild(row);
  }else if(el.type==='score'){
    const r1=document.createElement('div');
    r1.className='form-row';
    const l1=document.createElement('label');
    l1.textContent='记分板名称（如 @p）';
    const i1=document.createElement('input');
    i1.type='text';
    i1.value=el.scoreName;
    i1.oninput=()=>{ el.scoreName=i1.value; updateAll(); };
    r1.appendChild(l1); r1.appendChild(i1);
    card.appendChild(r1);
    const r2=document.createElement('div');
    r2.className='form-row';
    const l2=document.createElement('label');
    l2.textContent='计分板目标（如 kills）';
    const i2=document.createElement('input');
    i2.type='text';
    i2.value=el.scoreObj;
    i2.oninput=()=>{ el.scoreObj=i2.value; updateAll(); };
    r2.appendChild(l2); r2.appendChild(i2);
    card.appendChild(r2);
  }else if(el.type==='translate'){
    const r1=document.createElement('div');
    r1.className='form-row';
    const l1=document.createElement('label');
    l1.textContent='翻译键（如 item.minecraft.diamond）';
    const i1=document.createElement('input');
    i1.type='text';
    i1.value=el.translate;
    i1.oninput=()=>{ el.translate=i1.value; updateAll(); };
    r1.appendChild(l1); r1.appendChild(i1);
    card.appendChild(r1);
    const r2=document.createElement('div');
    r2.className='form-row';
    const l2=document.createElement('label');
    l2.textContent='with 参数（可选，逗号分隔多个文本）';
    const i2=document.createElement('input');
    i2.type='text';
    i2.value=el.withText;
    i2.oninput=()=>{ el.withText=i2.value; updateAll(); };
    r2.appendChild(l2); r2.appendChild(i2);
    card.appendChild(r2);
  }

  // 颜色
  const cRow=document.createElement('div');
  cRow.className='form-row';
  const cLab=document.createElement('label');
  cLab.textContent='颜色';
  const chips=document.createElement('div');
  chips.className='color-row';
  colors.forEach(([name,hex,title])=>{
    const c=document.createElement('div');
    c.className='color-chip'+(el.color===name?' selected':'');
    c.style.background=hex;
    c.title=title;
    c.onclick=()=>{ el.color=name; updateAll(); };
    chips.appendChild(c);
  });
  cRow.appendChild(cLab); cRow.appendChild(chips);
  card.appendChild(cRow);

  // 样式
  const sRow=document.createElement('div');
  sRow.className='form-row';
  const sLab=document.createElement('label');
  sLab.textContent='样式';
  const btns=document.createElement('div');
  btns.className='style-row';
  [['bold','粗体'],['strikethrough','删除线'],['underlined','下划线'],['italic','斜体']].forEach(([k,label])=>{
    const b=document.createElement('button');
    b.type='button';
    b.className='style-btn'+(el.styles.has(k)?' active':'');
    b.textContent=label;
    b.onclick=()=>{
      if(el.styles.has(k)){ el.styles.delete(k); } else { el.styles.add(k); }
      updateAll();
    };
    btns.appendChild(b);
  });
  sRow.appendChild(sLab); sRow.appendChild(btns);
  card.appendChild(sRow);

  box.appendChild(card);
});
}

function addElem(){
elems.push(newElem('text'));
renderElems();
}

/* ===== 生成 JSON ===== */
function elemToJson(el){
const obj={};
if(currentVer==='netease' && el.type==='text'){
  let codes='§'+secCode[el.color];
  ['bold','italic','underlined','strikethrough'].forEach(s=>{
    if(el.styles.has(s)) codes+='§'+styleCode[s];
  });
  obj.text=codes+(el.text||' ');
  return obj;
}
if(el.type==='text'){
  obj.text=el.text||' ';
}else if(el.type==='selector'){
  obj.selector=el.selector||'@p';
}else if(el.type==='score'){
  obj.score={name:el.scoreName||'@p',objective:el.scoreObj||''};
}else if(el.type==='translate'){
  obj.translate=el.translate||'';
  if(el.withText.trim()){
    obj.with=el.withText.split(/[,，]/).map(s=>s.trim()).filter(s=>s).map(s=>({text:s}));
  }
}
// 颜色与样式（网易版仅 text 走 § 码，其他类型不带 color 字段）
if(currentVer==='java'){
  obj.color=el.color;
  if(el.styles.has('bold')) obj.bold=true;
  if(el.styles.has('italic')) obj.italic=true;
  if(el.styles.has('underlined')) obj.underlined=true;
  if(el.styles.has('strikethrough')) obj.strikethrough=true;
}
return obj;
}

function buildJson(){
if(elems.length===0) return '';
const list=elems.map(elemToJson);
return JSON.stringify(list.length===1?list[0]:list);
}

/* ===== 预览 ===== */
function getCssColor(name){
const map={
'black':'#000','dark_blue':'#00a','dark_green':'#0a0','dark_aqua':'#0aa',
'dark_red':'#a00','dark_purple':'#a0a','gold':'#fa0','gray':'#aaa',
'dark_gray':'#555','blue':'#55f','green':'#5f5','aqua':'#5ff',
'red':'#f55','light_purple':'#f5f','yellow':'#ff5','white':'#fff'
};
return map[name]||'#fff';
}

function elemPreviewHtml(el){
let text;
if(el.type==='text'){
  text=el.text||' ';
}else if(el.type==='selector'){
  text='['+el.selector+']';
}else if(el.type==='score'){
  text='['+(el.scoreName||'@p')+' · '+(el.scoreObj||'?')+']';
}else if(el.type==='translate'){
  text='[翻译: '+(el.translate||'?')+']';
}
let css='color:'+getCssColor(el.color)+';';
if(el.styles.has('bold')) css+='font-weight:bold;';
if(el.styles.has('italic')) css+='font-style:italic;';
if(el.styles.has('underlined')) css+='text-decoration:underline;';
if(el.styles.has('strikethrough')) css+='text-decoration:line-through;';
return '<span style="'+css+'">'+escapeHtml(text)+'</span>';
}

function escapeHtml(s){
return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function updateAll(){
renderElems();
$('#previewBox').innerHTML=elems.map(elemPreviewHtml).join('');
$('#outputBox').textContent=buildJson();
}

/* ===== 复制 / 重置 ===== */
function copyCode(){
const code=$('#outputBox').textContent;
if(!code) return;
navigator.clipboard.writeText(code).then(()=>showToast('已复制到剪贴板')).catch(()=>{
const r=document.createRange();
r.selectNodeContents($('#outputBox'));
const sel=window.getSelection();
sel.removeAllRanges();
sel.addRange(r);
showToast('请按 Ctrl+C 复制');
});
}

function resetAll(){
elems=[newElem('text')];
elems[0].text='欢迎来到 The Slow Tide';
updateAll();
}

$('#themeToggle').onclick=()=>{
const cur=localStorage.getItem('tst-theme')||'light';
const next=cur==='dark'?'light':'dark';
localStorage.setItem('tst-theme',next);
document.documentElement.setAttribute('data-theme',next);
};

// 初始化
resetAll();
</script>
</body>
</html>
