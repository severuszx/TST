<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>T显编译器 - The Slow Tide</title>
<script>
(function(){
var mode=localStorage.getItem('tst-theme');
if(mode!=='dark' && mode!=='light'){ mode='light'; }
document.documentElement.setAttribute('data-theme',mode);
})();
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
--bg:#f3f5f8;
--text:#1f2937;
--text-secondary:#5b6675;
--border:#e2e8f0;
--card:#ffffff;
--hover:#eef2f7;
--header-bg:rgba(255,255,255,.92);
--primary:#0f172a;
--accent:#52525b;
--accent-soft:rgba(82,82,91,.1);
--shadow:0 4px 14px rgba(15,23,42,.07);
}
html[data-theme="dark"]{
--bg:#111113;
--text:#e5e5e7;
--text-secondary:#9a9aa0;
--border:#26262b;
--card:#18181b;
--hover:#222226;
--header-bg:rgba(17,17,19,.92);
--primary:#f4f4f5;
--accent:#a1a1aa;
--accent-soft:rgba(161,161,170,.14);
--shadow:0 4px 14px rgba(0,0,0,.5);
}
html[data-theme="dark"] .btn-primary{background:#71717a;}
body{
background:var(--bg);
color:var(--text);
font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
line-height:1.65;
}
.container{max-width:1140px;margin:0 auto;padding:0 16px;}
a{color:var(--accent);text-decoration:none;}
button{font-family:inherit;}

/* ===== 顶部导航 ===== */
.site-header{
position:sticky;top:0;z-index:100;
background:var(--header-bg);
backdrop-filter:blur(10px);
border-bottom:1px solid var(--border);
}
.header-inner{
display:flex;align-items:center;gap:18px;
min-height:62px;flex-wrap:wrap;
}
.logo{
font-size:20px;font-weight:700;color:var(--primary);
display:flex;align-items:center;gap:8px;white-space:nowrap;
}
.logo-img{
width:34px;height:34px;border-radius:4px;
object-fit:cover;flex:none;display:block;
}
html[data-theme="dark"] .logo-img{filter:invert(1);}
.main-nav{
display:flex;gap:2px;flex:1;flex-wrap:wrap;
}
.nav-link{
padding:8px 12px;border-radius:6px;border:none;background:transparent;
color:var(--text);font-size:14px;cursor:pointer;white-space:nowrap;
text-decoration:none;
}
.nav-link:hover{background:var(--hover);text-decoration:none;}
.nav-link.active{background:var(--accent-soft);color:var(--accent);font-weight:600;}
.header-right{
display:flex;align-items:center;gap:8px;margin-left:auto;flex-wrap:wrap;
}
.btn{
padding:8px 14px;border-radius:6px;border:1px solid var(--border);
background:var(--card);color:var(--text);cursor:pointer;font-size:14px;white-space:nowrap;
}
.btn:hover{background:var(--hover);}
.btn-primary{
background:#52525b;
border:none;color:#fff;font-weight:600;
}
.btn-primary:hover{filter:brightness(1.06);}
.theme-toggle{
position:relative;width:54px;height:28px;flex:none;
border:1px solid var(--border);background:var(--card);
border-radius:14px;cursor:pointer;padding:0;overflow:hidden;
}
.theme-toggle .tt-ic{
position:absolute;top:50%;transform:translateY(-50%);
font-size:13px;line-height:1;pointer-events:none;
}
.theme-toggle .tt-sun{left:8px;opacity:.75;}
.theme-toggle .tt-moon{right:8px;opacity:.75;}
.theme-toggle .tt-thumb{
position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;
background:var(--accent);display:flex;align-items:center;justify-content:center;
font-size:11px;color:#fff;transition:left .28s cubic-bezier(.4,0,.2,1),background-color .28s;
}
html[data-theme="dark"] .theme-toggle .tt-thumb{left:29px;}
body,.site-header,.card,.btn,.theme-toggle{
transition:background-color .3s ease,color .3s ease,border-color .3s ease;
}

/* ===== 页面 ===== */
.section{padding:26px 0;}
.section-title{
display:flex;align-items:center;gap:10px;
font-size:21px;font-weight:700;margin-bottom:18px;color:var(--primary);
}
.section-title::before{
content:'';width:5px;height:22px;border-radius:0;background:var(--accent);
}
.tool-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;}
.tool-card{
background:var(--card);border:1px solid var(--border);border-radius:10px;
padding:20px;box-shadow:var(--shadow);cursor:pointer;
transition:transform .2s ease,box-shadow .2s ease;
}
.tool-card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.1);}
.tool-card h3{font-size:17px;margin-bottom:8px;}
.tool-card p{font-size:14px;color:var(--text-secondary);}

/* ===== 编译器 ===== */
.compiler-wrap{display:none;}
.compiler-wrap.show{display:block;}
.compiler-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media(max-width:760px){.compiler-grid{grid-template-columns:1fr;}}
.card{
background:var(--card);border:1px solid var(--border);border-radius:10px;
padding:18px;box-shadow:var(--shadow);
}
.card h3{font-size:16px;margin-bottom:14px;}
.form-row{margin-bottom:12px;}
.form-row label{display:block;font-size:13px;color:var(--text-secondary);margin-bottom:5px;}
.form-row input[type="text"],.form-row textarea,.form-row select{
width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:6px;
background:var(--bg);color:var(--text);font-size:14px;outline:none;font-family:inherit;
}
.form-row input:focus,.form-row textarea:focus,.form-row select:focus{border-color:var(--accent);}
.form-row textarea{min-height:70px;resize:vertical;}
.color-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;}
.color-chip{
width:30px;height:30px;border-radius:6px;cursor:pointer;
border:2px solid transparent;transition:border-color .2s;
}
.color-chip.selected{border-color:var(--primary);box-shadow:0 0 0 2px var(--bg);}
.style-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;}
.style-btn{
padding:6px 14px;border:1px solid var(--border);border-radius:6px;
background:var(--bg);color:var(--text);cursor:pointer;font-size:13px;
}
.style-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.preview-box{
background:#1a1a1a;color:#fff;padding:16px;border-radius:8px;
min-height:90px;font-size:18px;margin-top:10px;
word-break:break-all;white-space:pre-wrap;
}
.output-box{
background:var(--bg);border:1px solid var(--border);border-radius:6px;
padding:12px;font-family:ui-monospace,Consolas,monospace;font-size:13px;
word-break:break-all;min-height:60px;color:var(--text);white-space:pre-wrap;
}
.btn-row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;}
.back-btn{margin-bottom:16px;}
.toast-wrap{
position:fixed;left:50%;bottom:34px;transform:translateX(-50%);z-index:300;
}
.toast-item{
background:var(--primary);color:var(--bg);padding:9px 18px;border-radius:6px;
font-size:14px;box-shadow:var(--shadow);
}
.hint{font-size:12px;color:var(--text-secondary);margin-top:6px;}

/* ===== 元素卡片 ===== */
.elem-list{display:flex;flex-direction:column;gap:12px;margin-top:4px;}
.elem-card{
border:1px solid var(--border);border-radius:8px;padding:12px;
background:var(--bg);
}
.elem-head{
display:flex;align-items:center;gap:8px;margin-bottom:10px;
}
.elem-head select{
padding:5px 8px;border:1px solid var(--border);border-radius:6px;
background:var(--card);color:var(--text);font-size:13px;outline:none;font-family:inherit;
}
.elem-del{
margin-left:auto;padding:4px 12px;border:none;border-radius:6px;
background:transparent;color:var(--text-secondary);cursor:pointer;font-size:13px;
}
.elem-del:hover{background:var(--hover);color:var(--text);}
.elem-num{
font-size:13px;font-weight:600;color:var(--accent);min-width:22px;
}
.add-elem{
margin-top:12px;width:100%;padding:10px;border:1px dashed var(--border);
border-radius:8px;background:transparent;color:var(--text-secondary);
cursor:pointer;font-size:14px;
}
.add-elem:hover{background:var(--hover);color:var(--text);}
.hint-line{font-size:12px;color:var(--text-secondary);margin-top:6px;}

/* 移动端导航（2A2MF6） */
@media(max-width:960px){
.header-inner{gap:8px;flex-wrap:wrap;}
.main-nav{order:3;flex-basis:100%;display:flex;overflow-x:auto;scrollbar-width:none;flex-wrap:nowrap;padding-bottom:2px;}
.main-nav::-webkit-scrollbar{display:none;}
.header-right{margin-left:0;flex-wrap:nowrap;}
.nav-link{font-size:13px;padding:7px 10px;}
}



/* ===== 液态玻璃主题 v8（iOS 27 液态玻璃·管理员内测）===== */
html[data-theme="glass"]{
color-scheme:light;
--bg:#eef2fb;
--text:#1f2937;
--text-secondary:#5b6675;
--border:rgba(255,255,255,.7);
--card:rgba(255,255,255,.35);
--hover:rgba(255,255,255,.55);
--header-bg:rgba(255,255,255,.4);
--primary:#111827;
--accent:#4f63d8;
--accent-soft:rgba(79,99,216,.12);
--shadow:0 20px 60px rgba(70,90,160,.16);
--hero-grad:linear-gradient(135deg,#dbe4ff,#e9e2ff);
--go1:.24;--go2:.08;--go3:.13;    /* 卡片渐变三段透明度（通透液态玻璃） */
--gn1:.24;                       /* 导航透明度 */
--gb1:.42;--gb2:.12;             /* 按钮透明度 */
--gsh1:30px;--gsh2:.12;--gsh3:10px;  /* 阴影扩展/强度/偏移 */
}
/* 背景：干净 iOS 壁纸渐变（无杂乱光斑） */
html[data-theme="glass"] body{
background:linear-gradient(160deg,#dee9ff 0%,#eaf2ff 26%,#e6efff 48%,#e5eeff 72%,#eef3ff 100%);
background-attachment:fixed;
}
/* 顶部柔和透亮光 */
html[data-theme="glass"] body::before{
content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
background:radial-gradient(1200px 800px at 10% -10%,rgba(130,185,255,.78),transparent 60%),
radial-gradient(1000px 740px at 90% 110%,rgba(115,165,255,.72),transparent 58%),
radial-gradient(780px 580px at 68% 26%,rgba(140,205,255,.68),transparent 62%),
radial-gradient(620px 500px at 26% 58%,rgba(195,160,255,.58),transparent 60%),
radial-gradient(540px 440px at 84% 42%,rgba(130,225,240,.52),transparent 58%),
radial-gradient(440px 380px at 52% 90%,rgba(255,190,215,.45),transparent 60%);
}
@keyframes glassBreath{0%{opacity:.88;}100%{opacity:1;}}
html[data-theme="glass"] .site-header,
html[data-theme="glass"] .notice-ticker,
html[data-theme="glass"] .container,
html[data-theme="glass"] .site-footer{position:relative;z-index:1;}
/* 导航液态玻璃 */
html[data-theme="glass"] .site-header{
background:linear-gradient(180deg,rgba(255,255,255,calc(var(--gn1,.16)*1.35)) 0%,rgba(255,255,255,var(--gn1,.16)) 100%);
backdrop-filter:saturate(250%) contrast(1.04);
border-bottom:1px solid rgba(255,255,255,.75);
box-shadow:0 10px 36px rgba(90,110,170,.1),inset 0 1px 0 rgba(255,255,255,.95),inset 0 -14px 30px rgba(255,255,255,.18);
}
html[data-theme="glass"] .logo{text-shadow:0 0 20px rgba(79,99,216,.3);}
html[data-theme="glass"] .logo-img{filter:none;}
html[data-theme="glass"] .main-nav a,
html[data-theme="glass"] .main-nav button{transition:color .25s ease,text-shadow .25s ease;}
html[data-theme="glass"] .main-nav a:hover,
html[data-theme="glass"] .main-nav button:hover{color:#4f63d8;text-shadow:0 0 16px rgba(79,99,216,.4);}
/* 卡片：真液态玻璃（顶部反射光带+边缘白描边+大圆角+柔阴影） */
html[data-theme="glass"] .card,
html[data-theme="glass"] .server-card,
html[data-theme="glass"] .notice-ticker,
html[data-theme="glass"] .hero-slider-wrap{position:relative;z-index:130;
background:linear-gradient(180deg,rgba(255,255,255,var(--go1,.12)) 0%,rgba(255,255,255,var(--go2,.04)) 50%,rgba(255,255,255,var(--go3,.07)) 100%);
backdrop-filter:saturate(300%) contrast(1.06) brightness(1.06);
border:1px solid rgba(255,255,255,.7);
border-radius:22px;
box-shadow:
0 0 0 1px rgba(140,160,210,.16),
0 var(--gsh3,12px) var(--gsh1,36px) rgba(90,110,170,var(--gsh2,.1)),
0 0 26px rgba(160,190,255,.14),
inset 0 1px 0 rgba(255,255,255,.95),
inset 0 -22px 36px rgba(255,255,255,.32);
transition:transform .45s cubic-bezier(.34,1.56,.64,1),box-shadow .4s ease,background .3s ease,border-color .3s ease;
}
html[data-theme="glass"] .card:hover,
html[data-theme="glass"] .server-card:hover{
transform:translateY(-6px) scale(1.015);
background:linear-gradient(180deg,rgba(255,255,255,calc(var(--go1,.24)*1.4)) 0%,rgba(255,255,255,calc(var(--go2,.08)*1.6)) 50%,rgba(255,255,255,calc(var(--go3,.13)*1.5)) 100%);
border-color:rgba(255,255,255,.95);
box-shadow:
0 0 0 1px rgba(255,255,255,.3),
0 calc(var(--gsh3,12px)*2) calc(var(--gsh1,36px)*1.5) rgba(90,110,170,calc(var(--gsh2,.12)*1.4)),
0 0 30px rgba(160,190,255,.14),
inset 0 1px 0 rgba(255,255,255,1);
}
/* 卡片入场 */
@keyframes cardIn{0%{opacity:0;transform:translateY(18px) scale(.97);}100%{opacity:1;transform:none;}}
html[data-theme="glass"] .card-grid .card{animation:cardIn .5s cubic-bezier(.34,1.56,.64,1) backwards;}
html[data-theme="glass"] .card-grid .card:nth-child(2){animation-delay:.06s;}
html[data-theme="glass"] .card-grid .card:nth-child(3){animation-delay:.12s;}
html[data-theme="glass"] .card-grid .card:nth-child(4){animation-delay:.18s;}
html[data-theme="glass"] .card-grid .card:nth-child(5){animation-delay:.24s;}
html[data-theme="glass"] .card-grid .card:nth-child(6){animation-delay:.3s;}
/* 按钮：液态玻璃胶囊 */
html[data-theme="glass"] .btn-primary,
html[data-theme="glass"] .feedback-btn,
html[data-theme="glass"] .collapse-btn{
background:linear-gradient(180deg,rgba(255,255,255,var(--gb1,.5)) 0%,rgba(255,255,255,var(--gb2,.16)) 100%);
backdrop-filter:blur(14px) saturate(270%) contrast(1.05);
border:1px solid rgba(255,255,255,.9);
border-radius:999px;
color:#111827;
box-shadow:0 6px 18px rgba(90,110,170,.13),inset 0 1px 0 rgba(255,255,255,1),inset 0 -10px 20px rgba(255,255,255,.25);
transition:transform .35s cubic-bezier(.34,1.56,.64,1),background .25s ease,box-shadow .35s ease;
}
html[data-theme="glass"] .btn-primary:hover,
html[data-theme="glass"] .feedback-btn:hover,
html[data-theme="glass"] .collapse-btn:hover{
transform:scale(1.05);
background:linear-gradient(180deg,rgba(255,255,255,.85) 0%,rgba(255,255,255,.45) 100%);
box-shadow:0 10px 28px rgba(70,90,160,.2),inset 0 1px 0 rgba(255,255,255,1);
}
html[data-theme="glass"] .btn-primary:active,
html[data-theme="glass"] .feedback-btn:active,
html[data-theme="glass"] .collapse-btn:active{transform:scale(.93);}
/* 输入框玻璃 */
html[data-theme="glass"] input[type="text"],
html[data-theme="glass"] input[type="search"],
html[data-theme="glass"] textarea,
html[data-theme="glass"] select{
background:rgba(255,255,255,.16);
backdrop-filter:saturate(260%) contrast(1.05);
border:1px solid rgba(255,255,255,.65);
border-radius:12px;
box-shadow:0 4px 14px rgba(90,110,170,.08),inset 0 1px 0 rgba(255,255,255,.9),inset 0 -10px 22px rgba(255,255,255,.14);
transition:border-color .25s ease,box-shadow .35s ease;
}
html[data-theme="glass"] input:focus,
html[data-theme="glass"] textarea:focus,
html[data-theme="glass"] select:focus{
border-color:rgba(79,99,216,.55);
box-shadow:0 0 0 3px rgba(79,99,216,.12),0 10px 30px rgba(70,90,160,.14);
}
/* 时间徽章 */
html[data-theme="glass"] .time-badge{
background:linear-gradient(180deg,rgba(255,255,255,.6),rgba(255,255,255,.2));
backdrop-filter:saturate(170%);
border:1px solid rgba(255,255,255,.6);
border-radius:999px;
box-shadow:0 4px 16px rgba(70,90,160,.1),inset 0 1px 0 rgba(255,255,255,.9);
}
/* 标题渐变 */
html[data-theme="glass"] .section-title{
background:linear-gradient(120deg,#111827,#4f63d8 55%,#7c3aed);
-webkit-background-clip:text;background-clip:text;color:transparent;
}
/* 徽章适配 */
html[data-theme="glass"] .pinned-tag{background:#4f63d8;color:#fff;}
html[data-theme="glass"] mark{background:rgba(250,204,21,.5);color:#111827;}
html[data-theme="glass"] .activity-joined{background:rgba(4,120,87,.12);color:#047857;}
html[data-theme="glass"] .lr-code{background:rgba(217,119,6,.12);color:#b45309;}
html[data-theme="glass"] .site-footer{border-top:1px solid rgba(255,255,255,.55);}
html[data-theme="glass"] .card-grid .card.drag-ready{cursor:grab;}
html[data-theme="glass"] .card-grid .card.dragging{
cursor:grabbing;transition:none!important;will-change:transform;z-index:60;
background:linear-gradient(180deg,rgba(255,255,255,.8),rgba(255,255,255,.4));
box-shadow:0 30px 70px rgba(70,90,160,.3),0 0 0 1px rgba(255,255,255,.4),inset 0 1px 0 rgba(255,255,255,1);
}
@keyframes dropBounce{
0%{transform:scale(1.12)}
32%{transform:scale(.965)}
58%{transform:scale(1.045)}
80%{transform:scale(.992)}
100%{transform:scale(1)}
}
/* 壁纸自选 */
html[data-theme="glass"][data-gb="aurora"] body{background:linear-gradient(165deg,#d3f8f5 0%,#e0f2fe 30%,#ede9fe 60%,#dff0ff 100%);}
html[data-theme="glass"][data-gb="sunset"] body{background:linear-gradient(165deg,#ffe8d6 0%,#ffe4e6 35%,#ffd6e7 65%,#ffe8e0 100%);}
html[data-theme="glass"][data-gb="mint"] body{background:linear-gradient(165deg,#d8f8e4 0%,#d9f4f2 30%,#dff0ff 65%,#e8f2ff 100%);}
html[data-theme="glass"][data-gb="custom"] body{background:linear-gradient(165deg,var(--gb-c1,#dce7ff) 0%,var(--gb-c2,#f4e8fb) 100%);}
/* 色板按钮与浮层 */
.glass-bg-picker{display:none;}
html[data-theme="glass"] .glass-bg-picker{display:block;}
html[data-theme="glass"] .glass-bg-btn{
width:34px;height:34px;border-radius:50%;
background:linear-gradient(135deg,#dce7ff,#e6e2ff,#f4e8fb);
border:1px solid rgba(255,255,255,.8);
box-shadow:0 4px 14px rgba(70,90,160,.18),inset 0 1px 0 rgba(255,255,255,.9);
cursor:pointer;margin-left:10px;vertical-align:middle;position:relative;
transition:transform .4s cubic-bezier(.34,1.56,.64,1),box-shadow .35s ease;
}
html[data-theme="glass"] .glass-bg-btn::after{
content:'';position:absolute;inset:5px;border-radius:50%;
background:linear-gradient(135deg,rgba(255,255,255,.55),rgba(255,255,255,.1));
}
html[data-theme="glass"] .glass-bg-btn:hover{transform:scale(1.12) rotate(10deg);box-shadow:0 8px 22px rgba(70,90,160,.28),inset 0 1px 0 rgba(255,255,255,1);}
html[data-theme="glass"] .glass-bg-btn:active{transform:scale(.9);}
html[data-theme="glass"] .glass-bg-picker{
position:absolute;top:52px;right:8px;z-index:120;
background:rgba(255,255,255,.52);
backdrop-filter:blur(28px) saturate(260%) contrast(1.05);
border:1px solid rgba(255,255,255,.75);
border-radius:18px;
box-shadow:0 20px 60px rgba(70,90,160,.25),inset 0 1px 0 rgba(255,255,255,.95);
padding:14px;
}
.gb-picker-title{font-size:12px;color:#5b6675;margin-bottom:10px;letter-spacing:.5px;}
.gb-options{display:flex;gap:12px;}
.gb-opt{cursor:pointer;text-align:center;}
.gb-swatch{
width:42px;height:42px;border-radius:14px;display:block;
border:1px solid rgba(255,255,255,.8);
box-shadow:0 4px 14px rgba(70,90,160,.18),inset 0 1px 0 rgba(255,255,255,.9);
transition:transform .3s cubic-bezier(.34,1.56,.64,1),box-shadow .3s ease;
}
.gb-opt:hover .gb-swatch{transform:scale(1.12);}
.gb-opt.active .gb-swatch{box-shadow:0 0 0 2px #4f63d8,0 6px 18px rgba(70,90,160,.25);}
.gb-opt span{display:block;margin-top:5px;font-size:10px;color:#5b6675;}
html[data-theme="glass"] .glass-bg-picker.hidden{display:none;}
/* 玻璃实验室（仅玻璃主题的专属功能） */
html[data-theme="glass"] .glass-bg-picker{
position:fixed;top:64px;right:18px;z-index:850;width:256px;
background:linear-gradient(180deg,rgba(255,255,255,.22) 0%,rgba(255,255,255,.12) 100%);
backdrop-filter:saturate(210%);
border:1px solid rgba(255,255,255,.8);
border-radius:20px;

['dark_green','#00aa00','深绿'],['dark_aqua','#00aaaa','深青'],['dark_red','#aa0000','深红'],
['dark_purple','#aa00aa','紫色'],['gold','#ffaa00','金色'],['gray','#aaaaaa','灰色'],
['dark_gray','#555555','深灰'],['blue','#5555ff','蓝色'],['green','#55ff55','绿色'],

setTimeout(()=>d.remove(),2000);
}

/* ===== 生成 JSON ===== */
function elemToJson(el){
const obj={};
if(currentVer==='netease' && el.type==='text'){
  let codes='§'+secCode[el.color];
  ['bold','italic','underlined','strikethrough'].forEach(s=>{
    if(el.styles.has(s)) codes+='§'+styleCode[s];
  });
  obj.text=codes+(el.text||' ');
  return obj;
}
if(el.type==='text'){
  obj.text=el.text||' ';
}else if(el.type==='selector'){
  obj.selector=el.selector||'@p';
}else if(el.type==='score'){
  obj.score={name:el.scoreName||'@p',objective:el.scoreObj||''};
}else if(el.type==='translate'){
  obj.translate=el.translate||'';
  if(el.withText.trim()){
    obj.with=el.withText.split(/[,，]/).map(s=>s.trim()).filter(s=>s).map(s=>({text:s}));
  }
}
// 颜色与样式（网易版仅 text 走 § 码，其他类型不带 color 字段）
if(currentVer==='java'){
  obj.color=el.color;
  if(el.styles.has('bold')) obj.bold=true;
  if(el.styles.has('italic')) obj.italic=true;
  if(el.styles.has('underlined')) obj.underlined=true;
  if(el.styles.has('strikethrough')) obj.strikethrough=true;
}
return obj;
}

function buildJson(){
if(elems.length===0) return '';
const list=elems.map(elemToJson);
return JSON.stringify(list.length===1?list[0]:list);
}

/* ===== 预览 ===== */
function getCssColor(name){
const map={
'black':'#000','dark_blue':'#00a','dark_green':'#0a0','dark_aqua':'#0aa',
'dark_red':'#a00','dark_purple':'#a0a','gold':'#fa0','gray':'#aaa',
'dark_gray':'#555','blue':'#55f','green':'#5f5','aqua':'#5ff',
'red':'#f55','light_purple':'#f5f','yellow':'#ff5','white':'#fff'
};
return map[name]||'#fff';
}

function elemPreviewHtml(el){
let text;
if(el.type==='text'){
  text=el.text||' ';
}else if(el.type==='selector'){
  text='['+el.selector+']';
}else if(el.type==='score'){
  text='['+(el.scoreName||'@p')+' · '+(el.scoreObj||'?')+']';
}else if(el.type==='translate'){
  text='[翻译: '+(el.translate||'?')+']';
}
let css='color:'+getCssColor(el.color)+';';
if(el.styles.has('bold')) css+='font-weight:bold;';
if(el.styles.has('italic')) css+='font-style:italic;';
if(el.styles.has('underlined')) css+='text-decoration:underline;';
if(el.styles.has('strikethrough')) css+='text-decoration:line-through;';
return '<span style="'+css+'">'+escapeHtml(text)+'</span>';
}

function escapeHtml(s){
return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function updateAll(){
renderElems();
$('#previewBox').innerHTML=elems.map(elemPreviewHtml).join('');
$('#outputBox').textContent=buildJson();
}

});
}

(function(){

(function(){

  function dbBind(){
    if(dbBound)return;dbBound=true;
    const input=document.getElementById('debugInput');
    const ok=document.getElementById('debugOk');
    const cancel=document.getElementById('debugCancel');
    const hint=document.getElementById('debugHint');
    if(!input||!ok||!cancel||!hint)return;
    function close(){const mask=document.getElementById('debugMask');if(mask)mask.classList.add('hidden');}
    function submit(){
      const code=(input.value||'').trim().toUpperCase();
      if(code==='TST-GLASS'){
        localStorage.setItem('tst-theme','glass');
        location.reload();
      } else if(code==='TST-LIGHT'){
        localStorage.setItem('tst-theme','light');
        location.reload();
      } else {
        hint.textContent='调试代码无效，请重试';hint.style.color='#dc2626';
      }
    }
    ok.addEventListener('click',submit);
    cancel.addEventListener('click',close);
    input.addEventListener('keydown',function(e){if(e.key==='Enter')submit();if(e.key==='Escape')close();});
    document.addEventListener('click',function(e){const mask=document.getElementById('debugMask');if(mask&&e.target===mask)close();});
  }
  link.addEventListener('click',function(){
    const mask=document.getElementById('debugMask');if(!mask)return;
    mask.classList.remove('hidden');
    const input=document.getElementById('debugInput');
    const hint=document.getElementById('debugHint');
    if(input)input.value='';
    if(hint){hint.textContent='输入调试代码可激活对应功能';hint.style.color='#9ca3af';}
    dbBind();
    setTimeout(function(){const i=document.getElementById('debugInput');if(i)i.focus();},50);
  });
})();

// ===== 卡片拖动（双模式：网格排序 / 自由摆放；主页/公告/动态小卡片通用，支持触屏）=====
(function(){
  function isGlass(){return themeState()==='glass';}
  function dragMode(){return localStorage.getItem('tst-drag-mode')||'grid';}
  const GAP=16;
  function isDragGrid(g){return g&&((g.classList&&g.classList.contains('card-grid'))||g.id==='feedList');}
  function nsOf(g){return g.id||'home';}
  function orderKeyOf(g){return 'tst-card-order-'+nsOf(g);}
  function freeKeyOf(g){return 'tst-card-free-'+nsOf(g);}
  function cardEls(g){return [].slice.call(g.children).filter(function(c){return c.classList&&c.classList.contains('card');});}
  function cols(g){return g.clientWidth>=700?2:1;}
  function cardWidth(g){const gw=g.clientWidth;return gw>=700?(gw-GAP)/2:gw;}
  function posOf(g,i){const cards=cardEls(g);const c=cols(g),cw=cardWidth(g),ch=(cards[0]&&cards[0].offsetHeight)?cards[0].offsetHeight:118;return {x:(i%c)*(cw+GAP),y:Math.floor(i/c)*(ch+GAP)};}
  function tagCards(g){cardEls(g).forEach(function(c,i){c.setAttribute('data-card-id',nsOf(g)+'-sc'+i);});}
  function applyOrder(g,order){
    const cards=cardEls(g);
    cards.forEach(function(card){
      const i=order.indexOf(card.getAttribute('data-card-id'));
      const p=posOf(g,i<0?0:i);
      card.style.width=cardWidth(g)+'px';
      card.style.left=p.x+'px';card.style.top=p.y+'px';
    });
    updateH(g);
  }
  function updateH(g){
    let mb=0;
    cardEls(g).forEach(function(c){const b=c.offsetTop+c.offsetHeight;if(b>mb)mb=b;});
    g.style.height=(mb+GAP)+'px';
  }
  function layoutInit(g){
    const cards=cardEls(g);
    if(!cards.length)return;
    tagCards(g);
    if(dragMode()==='free'){
      let fp={};try{fp=JSON.parse(localStorage.getItem(freeKeyOf(g))||'null');}catch(e){}
      if(!fp)fp={};
      cards.forEach(function(card,i){
        const id=card.getAttribute('data-card-id');
        card.style.width=cardWidth(g)+'px';
        if(fp[id]){card.style.left=fp[id][0]+'px';card.style.top=fp[id][1]+'px';}
        else{const p=posOf(g,i);card.style.left=p.x+'px';card.style.top=p.y+'px';}
      });
    }else{
      let order=[];try{order=JSON.parse(localStorage.getItem(orderKeyOf(g))||'null');}catch(e){}
      if(!Array.isArray(order)||order.length!==cards.length){order=cards.map(function(c){return c.getAttribute('data-card-id');});}
      applyOrder(g,order);
    }
    updateH(g);
  }
  function resetCardFree(g){
    cardEls(g).forEach(function(card){
      card.style.left='';card.style.top='';card.style.width='';card.style.transition='';card.style.zIndex='';
      card.classList.remove('dragging');
    });
    g.style.height='';
  }
  function allGrids(){return [].slice.call(document.querySelectorAll('.card-grid,#feedList')).filter(function(g){return g.clientWidth;});}
  function refreshAll(){allGrids().forEach(function(g){if(isGlass())layoutInit(g);else resetCardFree(g);});}

  let dragEl=null,dragGrid=null,startX=0,startY=0,startIdx=-1,curIdx=-1,dragging=false;
  document.addEventListener('pointerdown',function(e){
    if(!isGlass())return;
    const card=e.target.closest('.card');
    if(!card)return;
    const g=card.parentNode;
    if(!isDragGrid(g))return;
    if(e.target.closest('a,button,input,textarea,select'))return;
    const cards=cardEls(g);
    if(!cards.length)return;
    tagCards(g);
    layoutInit(g);
    dragEl=card;dragGrid=g;dragging=false;
    startX=e.clientX;startY=e.clientY;
    let order=null;
    if(dragMode()!=='free'){try{order=JSON.parse(localStorage.getItem(orderKeyOf(g))||'null');}catch(err){order=null;}}
    startIdx=(order&&order.length)?order.indexOf(card.getAttribute('data-card-id')):cards.indexOf(card);
    if(startIdx<0)startIdx=0;
    curIdx=startIdx;
  });
  document.addEventListener('pointermove',function(e){
    if(!dragEl||!dragGrid||!isGlass())return;
    const g=dragGrid,card=dragEl;
    const dx=e.clientX-startX,dy=e.clientY-startY;
    if(!dragging&&Math.hypot(dx,dy)<6)return;
    if(!dragging){dragging=true;card.classList.add('dragging');card.style.zIndex='70';}
    const cards=cardEls(g);
    if(dragMode()==='free'){
      const baseX=parseFloat(card.style.left)||card.offsetLeft;
      const baseY=parseFloat(card.style.top)||card.offsetTop;
      const gw=g.clientWidth,cw=cardWidth(g);
      const np={x:Math.max(0,Math.min(gw-cw,baseX+dx)),y:Math.max(0,baseY+dy)};
      card.style.left=np.x+'px';card.style.top=np.y+'px';
    }else{
      const c=cols(g),cw=cardWidth(g),ch=cards[0]?cards[0].offsetHeight:0;
      const sp=posOf(g,startIdx);
      card.style.left=(sp.x+dx)+'px';card.style.top=(sp.y+dy)+'px';
      const col=Math.round(dx/(cw+GAP))+(startIdx%c);
      const row=Math.round(dy/(ch+GAP))+Math.floor(startIdx/c);
      const ni=Math.max(0,Math.min(cards.length-1,row*c+col));
      if(ni!==curIdx){
        curIdx=ni;
        const id=card.getAttribute('data-card-id');
        let order=[];try{order=JSON.parse(localStorage.getItem(orderKeyOf(g))||'null');}catch(err){order=[];}
        if(!Array.isArray(order)||order.length!==cards.length){order=cards.map(function(c){return c.getAttribute('data-card-id');});}
        const from=order.indexOf(id);
        order.splice(from,1);order.splice(ni,0,id);
        cards.forEach(function(c){
          if(c===card)return;
          const pi=order.indexOf(c.getAttribute('data-card-id'));
          const p=posOf(g,pi);
          c.style.transition='left .4s cubic-bezier(.34,1.56,.64,1),top .4s cubic-bezier(.34,1.56,.64,1)';
          c.style.left=p.x+'px';c.style.top=p.y+'px';
        });
      }
    }
  });
  function endDrag(){
    if(!dragEl||!dragGrid||!isGlass())return;
    const card=dragEl,g=dragGrid;
    dragEl=null;dragGrid=null;
    if(!dragging)return;
    dragging=false;
    card.classList.remove('dragging');card.style.zIndex='';
    const cards=cardEls(g);
    if(dragMode()==='free'){
      const saved=JSON.parse(localStorage.getItem(freeKeyOf(g))||'{}')||{};
      cards.forEach(function(c){saved[c.getAttribute('data-card-id')]=[Math.round(c.offsetLeft),Math.round(c.offsetTop)];});
      localStorage.setItem(freeKeyOf(g),JSON.stringify(saved));
    }else{
      card.style.transition='left .4s cubic-bezier(.34,1.56,.64,1),top .4s cubic-bezier(.34,1.56,.64,1)';
      let order=[];try{order=JSON.parse(localStorage.getItem(orderKeyOf(g))||'null');}catch(err){order=[];}
      if(!Array.isArray(order)||order.length!==cards.length){order=cards.map(function(c){return c.getAttribute('data-card-id');});}
      const pi=order.indexOf(card.getAttribute('data-card-id'));
      const p=posOf(g,pi);
      card.style.left=p.x+'px';card.style.top=p.y+'px';
      localStorage.setItem(orderKeyOf(g),JSON.stringify(order));
      setTimeout(function(){cards.forEach(function(c){c.style.transition='';});card.style.transition='';},450);
    }
    card.style.animation='none';void card.offsetWidth;
    card.style.animation='dropBounce .6s cubic-bezier(.34,1.56,.64,1)';
    setTimeout(function(){card.style.animation='';},700);
  }
  document.addEventListener('pointerup',endDrag);
  document.addEventListener('pointercancel',endDrag);

  const themeObs=new MutationObserver(function(){refreshAll();});
  themeObs.observe(document.documentElement,{attributes:true,attributeFilter:['data-theme','data-gb']});
  const contentObs=new MutationObserver(function(){
    if(!isGlass())return;
    allGrids().forEach(function(g){tagCards(g);layoutInit(g);});
  });
  ['noticeList','feedList','replayList','sponsorList'].forEach(function(id){
    const el=document.getElementById(id);
    if(el)contentObs.observe(el,{childList:true});
  });
  refreshAll();
  window.addEventListener('resize',function(){
    if(!isGlass())return;
    allGrids().forEach(function(g){
      const cards=cardEls(g);
      if(dragMode()==='free'){cards.forEach(function(card){card.style.width=cardWidth(g)+'px';});}
      else{let order=[];try{order=JSON.parse(localStorage.getItem(orderKeyOf(g))||'null');}catch(e){} if(!Array.isArray(order)||order.length!==cards.length){order=cards.map(function(c){return c.getAttribute('data-card-id');});} applyOrder(g,order);}
    });
  });
  window.resetCardFree=function(){allGrids().forEach(function(g){resetCardFree(g);});};
  window.applyDragMode=function(){allGrids().forEach(function(g){resetCardFree(g);});refreshAll();};
})();


// ===== 拖动模式切换（玻璃实验室面板）=====
(function(){
  var seg=document.getElementById('gbDragSeg');
  if(!seg)return;
  var btns=seg.querySelectorAll('.gb-seg-btn');
  function sync(){
    var m=localStorage.getItem('tst-drag-mode')||'grid';
    btns.forEach(function(b){b.classList.toggle('active',b.getAttribute('data-drag')===m);});
  }
  function tip(text){
    var t=document.createElement('div');
    t.style.cssText='position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);z-index:999;padding:11px 20px;border-radius:14px;background:rgba(255,255,255,.85);backdrop-filter:blur(30px) saturate(180%);border:1px solid rgba(255,255,255,.75);box-shadow:0 16px 50px rgba(70,90,160,.2),inset 0 1px 0 rgba(255,255,255,.9);color:#1f2937;font-size:14px;opacity:0;transition:opacity .4s ease,transform .45s cubic-bezier(.34,1.56,.64,1);pointer-events:none;';
    t.textContent=text;
    document.body.appendChild(t);
    requestAnimationFrame(function(){t.style.opacity='1';t.style.transform='translateX(-50%) translateY(0)';});
    setTimeout(function(){t.style.opacity='0';t.style.transform='translateX(-50%) translateY(20px)';setTimeout(function(){t.remove();},450);},1800);
  }
  seg.addEventListener('click',function(e){
    var b=e.target.closest('.gb-seg-btn');
    if(!b)return;
    var m=b.getAttribute('data-drag');
    localStorage.setItem('tst-drag-mode',m);
    sync();
    if(window.applyDragMode)applyDragMode();
    tip(m==='free'?'已切换：自由摆放（拖到哪放哪）':'已切换：网格排序（自动对齐）');
  });
  sync();
})();

// ===== 液态玻璃特效：鼠标光晕 + 卡片反光 + 滚动渐入 =====
(function(){
  function gs(){return themeState()==='glass';}
  var m=document.createElement('div');
  m.style.cssText='position:fixed;left:0;top:0;width:340px;height:340px;border-radius:50%;pointer-events:none;z-index:2;background:radial-gradient(circle,rgba(255,255,255,.3),transparent 66%);mix-blend-mode:screen;transform:translate(-50%,-50%);opacity:0;transition:opacity .5s ease;';
  document.body.appendChild(m);
  var shown=false;
  document.addEventListener('mousemove',function(e){
    if(!gs()){m.style.opacity='0';return;}
    if(!shown){shown=true;m.style.opacity='1';}
    m.style.left=e.clientX+'px';m.style.top=e.clientY+'px';
  });
  function bindCard(card){
    card.addEventListener('mousemove',function(e){
      var r=card.getBoundingClientRect();
      var x=((e.clientX-r.left)/r.width*100).toFixed(1),y=((e.clientY-r.top)/r.height*100).toFixed(1);
      card.style.setProperty('--mx',x+'%');card.style.setProperty('--my',y+'%');
    });
  }
  var cards=document.querySelectorAll('.card-grid .card');
  for(var i=0;i<cards.length;i++)bindCard(cards[i]);
  var els=[].slice.call(document.querySelectorAll('.section-title,.card-grid,.notice-ticker,.hero-slider-wrap,.server-card'));
  els.forEach(function(el){el.classList.add('gb-wait');});
  var io=null;
  if('IntersectionObserver' in window){
    io=new IntersectionObserver(function(es){
      es.forEach(function(en){if(en.isIntersecting){en.target.classList.add('gb-in');io.unobserve(en.target);}});
    },{threshold:.05});
    els.forEach(function(el){io.observe(el);});
  }
  // 兜底：1.2s 后仍未进入视口的元素强制显示，避免卡白
  setTimeout(function(){
    els.forEach(function(el){el.classList.add('gb-in');});
    if(io)io.disconnect();
  },1200);
})();

// 首次玻璃主题提示：小卡片可自由拖动
(function(){
  if(localStorage.getItem('tst-card-drag-hint'))return;
  let shown=false;
  const showHint=function(){
    if(shown||themeState()!=='glass')return;
    shown=true;
    localStorage.setItem('tst-card-drag-hint','1');
    const tip=document.createElement('div');
    tip.id='glassDragTip';
    tip.textContent='液态玻璃主题下，亮点小卡片可自由拖动排列';
    tip.style.cssText='position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);z-index:999;padding:11px 20px;border-radius:14px;background:rgba(255,255,255,.7);backdrop-filter:blur(30px) saturate(180%);border:1px solid rgba(255,255,255,.75);box-shadow:0 16px 50px rgba(70,90,160,.2),inset 0 1px 0 rgba(255,255,255,.9);color:#1f2937;font-size:14px;opacity:0;transition:opacity .4s ease,transform .45s cubic-bezier(.34,1.56,.64,1);pointer-events:none;';
    document.body.appendChild(tip);
    requestAnimationFrame(function(){tip.style.opacity='1';tip.style.transform='translateX(-50%) translateY(0)';});
    setTimeout(function(){tip.style.opacity='0';tip.style.transform='translateX(-50%) translateY(20px)';setTimeout(function(){tip.remove();},500);},3400);
  };
  showHint();
})();
</script>
