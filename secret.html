<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>潮汐深处 - The Slow Tide</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:#020617;color:#e0f2fe;overflow:hidden;}
.secret-page{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(180deg,#020617 0%,#062a3a 55%,#0a4a5c 100%);overflow:hidden;}
.sp-wave{position:absolute;inset:-20%;background:radial-gradient(ellipse at 50% 120%,rgba(56,189,248,.28),transparent 55%),radial-gradient(ellipse at 20% 100%,rgba(14,116,144,.4),transparent 60%);animation:spDrift 9s ease-in-out infinite alternate;pointer-events:none!important;}
@keyframes spDrift{0%{transform:translate(0,0) scale(1)}100%{transform:translate(-4%,-3%) scale(1.06)}}
.sp-line{position:relative;z-index:2;color:rgba(186,230,253,.72);font-size:17px;letter-spacing:8px;text-shadow:0 0 18px rgba(56,189,248,.5);margin-bottom:36px;}
.sp-input{position:relative;z-index:2;width:260px;max-width:80vw;padding:12px 18px;border:1px solid rgba(56,189,248,.4);border-radius:10px;background:rgba(2,6,23,.55);color:#e0f2fe;font-size:15px;letter-spacing:2px;outline:none;text-align:center;pointer-events:auto!important;-webkit-appearance:none;}
.sp-input:focus{border-color:rgba(56,189,248,.9);box-shadow:0 0 24px rgba(56,189,248,.35);}
.sp-btn{position:relative;z-index:2;margin-top:16px;padding:10px 40px;border:1px solid rgba(56,189,248,.55);border-radius:999px;background:rgba(8,47,73,.5);color:#7dd3fc;font-size:14px;letter-spacing:6px;cursor:pointer;transition:all .2s;pointer-events:auto!important;}
.sp-btn:hover{background:rgba(14,116,144,.6);color:#e0f2fe;box-shadow:0 0 26px rgba(56,189,248,.4);}
.sp-msg{position:relative;z-index:2;margin-top:22px;min-height:22px;font-size:13px;letter-spacing:2px;color:rgba(186,230,253,.9);text-align:center;max-width:340px;line-height:1.7;}
.sp-msg.err{color:#fca5a5;}
.sp-msg.win{color:#fde68a;font-size:15px;text-shadow:0 0 18px rgba(251,191,36,.8);}
.sp-gift{position:relative;z-index:2;margin-top:14px;font-family:Consolas,monospace;font-size:22px;letter-spacing:3px;color:#fde68a;text-shadow:0 0 22px rgba(245,158,11,.9);animation:giftBlink 1s ease-in-out infinite;}
@keyframes giftBlink{0%,100%{opacity:1}50%{opacity:.55}}
.sp-boom{position:absolute;z-index:3;width:10px;height:10px;border-radius:50%;pointer-events:none!important;}
.sp-back{position:absolute;top:20px;left:24px;z-index:4;color:rgba(186,230,253,.5);font-size:13px;letter-spacing:2px;text-decoration:none;transition:color .2s;}
.sp-back:hover{color:#fff;}
</style>
</head>
<body>
<div class="secret-page" id="secretPage">
  <div class="sp-wave"></div>
  <a class="sp-back" href="/">‹ 返回</a>
  <p class="sp-line">潮汐沉寂，叩门以待</p>
  <input class="sp-input" id="secretKey" type="password" placeholder="输入密钥" autocomplete="off">
  <button class="sp-btn" id="secretBtn">叩门</button>
  <p class="sp-msg" id="secretMsg"></p>
  <p class="sp-gift hidden" id="secretGift"></p>
</div>
<script>
function secretBoom(){
  var sp=document.getElementById('secretPage');
  if(!sp) return;
  for(var i=0;i<60;i++){
    var b=document.createElement('i');
    b.className='sp-boom';
    var a=Math.random()*Math.PI*2, d=120+Math.random()*380;
    b.style.left='50%'; b.style.top='55%';
    b.style.background=['#fde68a','#f59e0b','#7dd3fc','#fff','#fbbf24'][i%5];
    b.style.boxShadow='0 0 16px currentColor';
    b.style.transition='transform 1.2s cubic-bezier(.1,.8,.3,1),opacity 1.2s';
    sp.appendChild(b);
    setTimeout(function(el,dx,dy){
      el.style.transform='translate('+dx+'px,'+dy+'px) scale(.2)';
      el.style.opacity='0';
    },30,b,Math.cos(a)*d,Math.sin(a)*d);
    setTimeout(function(el){ el.remove(); },1500,b);
  }
}
function doSecret(){
  var inp=document.getElementById('secretKey');
  var msg=document.getElementById('secretMsg');
  var gift=document.getElementById('secretGift');
  var key=(inp?inp.value:'').trim();
  if(!key){ if(msg){msg.textContent='请输入密钥';msg.className='sp-msg err';} return; }
  if(msg){ msg.textContent='潮汐正在翻涌...'; msg.className='sp-msg'; }
  fetch('/api/secret',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key:key})})
    .then(function(r){return r.json();})
    .then(function(res){
      if(res && res.ok){
        if(msg){ msg.textContent='潮渊已开。你的一次性兑换码：'; msg.className='sp-msg win'; }
        if(gift){ gift.textContent=res.code; gift.classList.remove('hidden'); }
        secretBoom();
      } else if(res && res.error==='used_up'){
        if(msg){ msg.textContent='潮汐已沉寂。这份馈赠已被他人取走，潮门已闭。'; msg.className='sp-msg err'; }
      } else if(res && res.error==='invalid'){
        if(msg){ msg.textContent='潮汐紊乱，密钥无效，请重试。'; msg.className='sp-msg err'; }
      } else {
        if(msg){ msg.textContent='潮汐紊乱，密钥无效，请重试。'; msg.className='sp-msg err'; }
      }
    })
    .catch(function(){ if(msg){ msg.textContent='潮汐信号中断，请稍后再试。'; msg.className='sp-msg err'; } });
}
(function(){
  var sb=document.getElementById('secretBtn');
  if(sb) sb.onclick=doSecret;
  var sk=document.getElementById('secretKey');
  if(sk) sk.addEventListener('keydown',function(e){ if(e.key==='Enter') doSecret(); });
})();
</script>
</body>
</html>
