<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理后台 - The Slow Tide</title>
<link rel="icon" href="logo.jpg" type="image/jpeg">
<style>
:root{
  color-scheme:light;
  --bg:#f3f5f8; --text:#1f2937; --text-secondary:#5b6675; --border:#e2e8f0;
  --card:#ffffff; --hover:#eef2f7; --header-bg:rgba(255,255,255,.92);
  --primary:#0f172a; --accent:#52525b; --accent-soft:rgba(82,82,91,.1);
  --shadow:0 4px 14px rgba(15,23,42,.07);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;font-size:15px;line-height:1.6;}
a{color:inherit;text-decoration:none;}
.container{max-width:1220px;margin:0 auto;padding:0 16px;}

header{position:sticky;top:0;z-index:20;background:var(--header-bg);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);}
.header-inner{display:flex;align-items:center;gap:14px;height:60px;}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:16px;color:var(--primary);}
.brand img{width:28px;height:28px;object-fit:cover;}
.brand .sub{font-weight:500;font-size:13px;color:var(--text-secondary);}
.header-right{margin-left:auto;display:flex;align-items:center;gap:10px;}
.who{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--text-secondary);}
.who b{color:var(--text);}
.admin-tag{display:none;background:var(--accent);color:#fff;font-size:11px;font-weight:700;padding:2px 7px;border-radius:4px;letter-spacing:.5px;}
.admin-tag.on{display:inline-block;}

.btn{padding:8px 14px;border-radius:6px;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer;font-size:14px;white-space:nowrap;font-family:inherit;transition:background-color .15s ease;}
.btn:hover{background:var(--hover);}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.btn-primary{background:#52525b;border:1px solid #52525b;color:#fff;font-weight:600;}
.btn-primary:hover{filter:brightness(1.08);background:#52525b;}
.btn-danger{background:#fee2e2;border-color:#fecaca;color:#b91c1c;}
.btn-danger:hover{background:#fecaca;}
.btn-sm{padding:5px 10px;font-size:13px;border-radius:5px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:18px;box-shadow:var(--shadow);}
.section-title{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:700;margin:24px 0 14px;color:var(--primary);}
.section-title::before{content:'';width:5px;height:22px;background:var(--accent);flex:none;}
.section-title:first-child{margin-top:0;}
.sub-title{font-size:15px;font-weight:700;margin:0 0 10px;color:var(--primary);}
.muted{color:var(--text-secondary);font-size:13px;}
input[type=text],input[type=number],input[type=date],input[type=file],textarea,select{width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:6px;background:var(--card);color:var(--text);font-size:14px;font-family:inherit;outline:none;}
input:focus,textarea:focus,select:focus{border-color:#b6bcc6;box-shadow:0 0 0 3px rgba(82,82,91,.08);}
textarea{resize:vertical;min-height:88px;line-height:1.6;}
label.field{display:block;margin-bottom:12px;}
label.field > span{display:block;font-size:13px;font-weight:600;color:var(--text-secondary);margin-bottom:5px;}

.layout{display:flex;gap:22px;align-items:flex-start;padding:22px 0 60px;}
.side{width:186px;flex:none;position:sticky;top:78px;}
.side .nav-item{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;padding:9px 12px;border-radius:6px;border:1px solid transparent;background:transparent;color:var(--text);font-size:14px;cursor:pointer;text-align:left;font-family:inherit;margin-bottom:2px;}
.side .nav-item:hover{background:var(--hover);}
.side .nav-item.active{background:#52525b;color:#fff;font-weight:600;}
.side .nav-item .cnt{font-size:12px;opacity:.75;}
.main{flex:1;min-width:0;}

.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:8px;background:var(--card);}
table{width:100%;border-collapse:collapse;font-size:13.5px;}
thead th{background:#f8fafc;text-align:left;font-weight:600;color:var(--text-secondary);padding:9px 12px;border-bottom:1px solid var(--border);white-space:nowrap;}
tbody td{padding:9px 12px;border-bottom:1px solid #f1f5f9;vertical-align:top;}
tbody tr:last-child td{border-bottom:none;}
tbody tr:hover{background:#fafbfc;}
td.nowrap{white-space:nowrap;}
td.ops{white-space:nowrap;text-align:right;}
td.ops .btn{margin-left:6px;}
.clip{max-width:400px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap;}
.toolbar .grow{flex:1;min-width:180px;}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:12px;font-size:13px;}

.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;}
.stat{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:16px 18px;box-shadow:var(--shadow);}
.stat .k{font-size:12.5px;color:var(--text-secondary);margin-bottom:4px;}
.stat .v{font-size:26px;font-weight:700;color:var(--primary);line-height:1.2;}
.stat .note{font-size:12px;color:var(--text-secondary);margin-top:4px;}

.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:13px;}
.bar-row .lb{width:92px;flex:none;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bar-track{flex:1;height:9px;background:#eef2f7;border-radius:5px;overflow:hidden;}
.bar-fill{height:100%;background:#52525b;border-radius:5px;}
.bar-row .num{width:38px;text-align:right;font-variant-numeric:tabular-nums;}

.mask{position:fixed;inset:0;background:rgba(15,23,42,.34);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:18px;z-index:900;opacity:0;pointer-events:none;transition:opacity .16s ease;}
.mask.show{opacity:1;pointer-events:auto;}
.dialog{width:100%;max-width:460px;background:var(--card);border:1px solid var(--border);border-radius:12px;box-shadow:0 18px 44px rgba(15,23,42,.18);padding:20px;transform:translateY(8px);transition:transform .16s ease;}
.mask.show .dialog{transform:translateY(0);}
.dialog h4{font-size:16.5px;font-weight:700;color:var(--primary);margin-bottom:8px;}
.dialog .body{font-size:14px;white-space:pre-line;margin-bottom:16px;}
.dialog .foot{display:flex;gap:10px;justify-content:flex-end;}

.toast-box{position:fixed;right:16px;bottom:16px;z-index:950;display:flex;flex-direction:column;gap:8px;}
.toast{min-width:210px;max-width:340px;padding:10px 14px;border-radius:8px;font-size:13.5px;background:#fff;border:1px solid var(--border);box-shadow:0 10px 26px rgba(15,23,42,.14);border-left:4px solid #52525b;animation:tin .18s ease;}
.toast.ok{border-left-color:#16a34a;}
.toast.err{border-left-color:#dc2626;}
.toast.warn{border-left-color:#d97706;}
@keyframes tin{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

.busy-mask{position:fixed;inset:0;background:rgba(243,245,248,.55);z-index:940;display:none;align-items:center;justify-content:center;}
.busy-mask.show{display:flex;}
.busy-box{background:#fff;border:1px solid var(--border);border-radius:10px;padding:14px 20px;font-size:14px;box-shadow:var(--shadow);display:flex;gap:10px;align-items:center;}
.spin{width:14px;height:14px;border:2px solid #d7dce3;border-top-color:#52525b;border-radius:50%;animation:sp .8s linear infinite;}
@keyframes sp{to{transform:rotate(360deg);}}

.console{background:#0f172a;color:#e5e7eb;border-radius:8px;padding:14px;font-family:ui-monospace,Consolas,"Courier New",monospace;font-size:12.5px;line-height:1.7;max-height:420px;overflow:auto;white-space:pre-wrap;word-break:break-word;}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0;}
.chip{padding:5px 11px;border-radius:999px;border:1px solid var(--border);background:var(--card);font-size:13px;cursor:pointer;font-family:inherit;color:var(--text);}
.chip:hover{background:var(--hover);}
.cmd-row{display:flex;gap:10px;}
.cmd-row input{flex:1;}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.pill{display:inline-block;padding:2px 8px;border-radius:4px;font-size:12px;font-weight:600;}
.pill.on{background:#dcfce7;color:#15803d;}
.pill.off{background:#fee2e2;color:#b91c1c;}
.gate{padding:60px 0;}
.gate .card{max-width:480px;margin:0 auto;}
.hide{display:none !important;}

@media (max-width:900px){
  .layout{flex-direction:column;}
  .side{width:100%;position:static;display:flex;flex-wrap:wrap;gap:6px;}
  .side .nav-item{width:auto;margin:0;}
  .two-col{grid-template-columns:1fr;}
  .header-inner{height:auto;padding:10px 0;flex-wrap:wrap;}
}
</style>
</head>
<body>

<header>
  <div class="container header-inner">
    <a class="brand" href="/"><img src="logo.jpg" alt="TST"><span>管理后台<span class="sub"> · The Slow Tide</span></span></a>
    <div class="header-right">
      <div class="who"><span class="admin-tag" id="adminTag">管理员</span><span id="whoText">检测中…</span></div>
      <button class="btn btn-sm" id="btnReload" type="button">刷新数据</button>
      <a class="btn btn-sm" href="/">返回官网</a>
    </div>
  </div>
</header>

<div class="container gate hide" id="gateBox">
  <div class="card">
    <div class="section-title" id="gateTitle" style="margin-top:0">需要管理员账号</div>
    <p class="muted" id="gateDesc" style="margin-bottom:14px"></p>
    <div style="display:flex;gap:10px">
      <a class="btn btn-primary" href="/login.html" id="gateLogin">去官网登录</a>
      <button class="btn" type="button" id="gateRetry">重新检测</button>
    </div>
  </div>
</div>

<div class="container layout hide" id="appBox">
  <aside class="side" id="sideNav">
    <button class="nav-item active" type="button" data-tab="overview">概览</button>
    <button class="nav-item" type="button" data-tab="announce">服务器公告<span class="cnt" data-cnt="announcements"></span></button>
    <button class="nav-item" type="button" data-tab="feed">赛事动态<span class="cnt" data-cnt="feeds"></span></button>
    <button class="nav-item" type="button" data-tab="sponsor">赞助名单<span class="cnt" data-cnt="sponsors"></span></button>
    <button class="nav-item" type="button" data-tab="replay">录像<span class="cnt" data-cnt="replays"></span></button>
    <button class="nav-item" type="button" data-tab="image">图片素材<span class="cnt" data-cnt="images"></span></button>
    <button class="nav-item" type="button" data-tab="server">服务器控制</button>
    <button class="nav-item" type="button" data-tab="serverinfo">服务器信息</button>
    <button class="nav-item" type="button" data-tab="version">版本发布</button>
  </aside>
  <main class="main" id="mainArea"></main>
</div>

<div class="mask" id="maskBox"><div class="dialog" id="dialogBox"></div></div>
<div class="toast-box" id="toastBox"></div>
<div class="busy-mask" id="busyBox"><div class="busy-box"><span class="spin"></span><span id="busyText">处理中…</span></div></div>

<script>
(function(){
'use strict';

var TOKEN = '';
try { TOKEN = localStorage.getItem('tst_token') || ''; } catch(e){ TOKEN = ''; }

var DATA = null, DATA_AT = 0, DATA_TTL = 30000;
var CUR_TAB = 'overview', BUSY = false;
var PAGE_SIZE = 12;
var PAGE = { announce:1, feed:1, sponsor:1, replay:1, image:1 };
var SEARCH = { announce:'', feed:'', sponsor:'', replay:'', image:'' };
var EDIT = { announce:null, feed:null, sponsor:null, replay:null };
var LOGS = [], EVENTS = [], PERF = [], STATUS = null;

function $(s,r){ return (r||document).querySelector(s); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function pad(n){ return (n<10?'0':'')+n; }
function today(){ var d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function fmtDate(v){
  if(!v) return '-';
  var s = String(v);
  if(/^hist:/.test(s)) s = s.slice(5);
  return s.replace('T',' ').slice(0,16);
}

/* ---------- 站内弹窗 / 提示 ---------- */
var dialogResolve = null;
function confirmBox(opt){
  var box = $('#dialogBox');
  box.innerHTML = '<h4>'+esc(opt.title||'确认')+'</h4>'+
    '<div class="body">'+esc(opt.desc||'')+'</div>'+
    '<div class="foot"><button class="btn" type="button" data-act="cancel">'+esc(opt.cancelText||'取消')+'</button>'+
    '<button class="btn '+(opt.danger?'btn-danger':'btn-primary')+'" type="button" data-act="ok">'+esc(opt.okText||'确定')+'</button></div>';
  $('#maskBox').classList.add('show');
  return new Promise(function(resolve){
    dialogResolve = resolve;
    box.querySelector('[data-act=cancel]').onclick = function(){ closeDialog(false); };
    box.querySelector('[data-act=ok]').onclick = function(){ closeDialog(true); };
  });
}
function closeDialog(v){
  $('#maskBox').classList.remove('show');
  if(dialogResolve){ var f = dialogResolve; dialogResolve = null; f(v); }
}
$('#maskBox').addEventListener('click', function(e){ if(e.target === this) closeDialog(false); });
function toast(msg, kind){
  var d = document.createElement('div');
  d.className = 'toast ' + (kind||'');
  d.textContent = msg;
  $('#toastBox').appendChild(d);
  setTimeout(function(){ if(d.parentNode) d.parentNode.removeChild(d); }, 2800);
}
function busy(on, text){
  BUSY = !!on;
  $('#busyText').textContent = text || '处理中…';
  $('#busyBox').classList.toggle('show', !!on);
}

/* ---------- 接口 ---------- */
function authHeaders(){ return TOKEN ? { 'Authorization': 'Bearer ' + TOKEN } : {}; }
function adminApi(action, payload){
  var body = Object.assign({ action: action }, payload || {});
  return fetch('/api/dadmin', {
    method:'POST',
    headers: Object.assign({ 'Content-Type':'application/json' }, authHeaders()),
    body: JSON.stringify(body),
    cache:'no-store'
  }).then(function(r){ return r.json(); }).catch(function(e){
    return { ok:false, error:'network', detail:String((e&&e.message)||e) };
  });
}
function loadData(force){
  if(!force && DATA && (Date.now() - DATA_AT) < DATA_TTL) return Promise.resolve(DATA);
  return fetch('/api/data', { cache:'no-store' }).then(function(r){ return r.json(); }).then(function(j){
    if(j && j.ok !== false){ DATA = j; DATA_AT = Date.now(); }
    return DATA;
  }).catch(function(){ return DATA; });
}
function tokenEmail(){
  if(!TOKEN) return '';
  try{
    var b = TOKEN.split('.')[1] || '';
    var s = atob(b.replace(/-/g,'+').replace(/_/g,'/'));
    var o = JSON.parse(decodeURIComponent(escape(s)));
    return o.email || '';
  }catch(e){ return ''; }
}

/* ---------- 权限检测：账号即权限，不输入口令 ---------- */
function showGate(reason){
  $('#appBox').classList.add('hide');
  $('#gateBox').classList.remove('hide');
  $('#adminTag').classList.remove('on');
  if(reason === 'no_login'){
    $('#gateTitle').textContent = '还没有登录';
    $('#gateDesc').textContent = '后台不再单独收取口令：用官网账号登录后，只要该账号有管理员权限就直接进入。';
    $('#gateLogin').textContent = '去官网登录';
  }else if(reason === 'no_admin'){
    $('#gateTitle').textContent = '当前账号不是管理员';
    $('#gateDesc').textContent = '已经读到登录状态，但这个账号的 admin_level 不足 1，没有后台权限。换管理员账号登录后再来。';
    $('#gateLogin').textContent = '换账号登录';
  }else{
    $('#gateTitle').textContent = '权限检测未通过';
    $('#gateDesc').textContent = '检测接口没有给出明确的通过结果：' + String(reason||'未知原因') + '。可能是网络或服务端临时异常。';
  }
}
function checkAdmin(){
  var em = tokenEmail();
  $('#whoText').textContent = em || (TOKEN ? '已登录账号' : '未登录');
  if(!TOKEN){ showGate('no_login'); return Promise.resolve(false); }
  return fetch('/api/tst-log/list?limit=5', { headers: authHeaders(), cache:'no-store' })
    .then(function(r){
      if(r.status === 403){ showGate('no_admin'); return false; }
      if(!r.ok) throw new Error('HTTP ' + r.status);
      return r.json().then(function(j){
        if(j && j.ok === false){ showGate('接口返回 ' + (j.error||'失败')); return false; }
        $('#adminTag').classList.add('on');
        $('#gateBox').classList.add('hide');
        $('#appBox').classList.remove('hide');
        return true;
      });
    })
    .catch(function(e){ showGate(String((e&&e.message)||e)); return false; });
}

/* ---------- 渲染工具 ---------- */
function S(k){ return (DATA && DATA[k]) || []; }
function setCounts(){
  var m = { announcements:0, feeds:0, sponsors:0, replays:0, images:0 };
  Object.keys(m).forEach(function(k){
    var n = document.querySelector('[data-cnt="'+k+'"]');
    if(n) n.textContent = S(k).length ? '('+S(k).length+')' : '';
  });
}
function stat(k,v,note){
  return '<div class="stat"><div class="k">'+esc(k)+'</div><div class="v">'+esc(v)+'</div>'+(note?'<div class="note">'+esc(note)+'</div>':'')+'</div>';
}
function tableHtml(cols, rows){
  var h = '<div class="table-wrap"><table><thead><tr>';
  cols.forEach(function(c){ h += '<th'+(c.w?' style="width:'+c.w+'"':'')+'>'+esc(c.t)+'</th>'; });
  h += '</tr></thead><tbody>';
  if(!rows.length) h += '<tr><td colspan="'+cols.length+'" style="text-align:center;color:var(--text-secondary);padding:26px">暂无数据</td></tr>';
  rows.forEach(function(r){
    h += '<tr>';
    cols.forEach(function(c){ h += '<td'+(c.cls?' class="'+c.cls+'"':'')+'>'+(c.r ? c.r(r) : esc(r[c.k]))+'</td>'; });
    h += '</tr>';
  });
  h += '</tbody></table></div>';
  return h;
}
function pagerHtml(key, total){
  var pages = Math.max(1, Math.ceil(total/PAGE_SIZE));
  var cur = Math.min(PAGE[key]||1, pages);
  return '<div class="pager"><span class="muted">共 '+total+' 条 · 第 '+cur+'/'+pages+' 页</span>'+
    '<button class="btn btn-sm" type="button" data-page="prev" data-key="'+key+'"'+(cur<=1?' disabled':'')+'>上一页</button>'+
    '<button class="btn btn-sm" type="button" data-page="next" data-key="'+key+'"'+(cur>=pages?' disabled':'')+'>下一页</button></div>';
}
function paged(arr, key){
  var s = ((PAGE[key]||1)-1)*PAGE_SIZE;
  return arr.slice(s, s+PAGE_SIZE);
}
function filt(arr, q, fields){
  q = String(q||'').trim().toLowerCase();
  if(!q) return arr;
  return arr.filter(function(x){
    return fields.some(function(f){ return String(x[f]==null?'':x[f]).toLowerCase().indexOf(q) >= 0; });
  });
}

/* ---------- 概览 ---------- */
function viewOverview(){
  var ann = S('announcements'), fd = S('feeds'), sp = S('sponsors'), rp = S('replays'), im = S('images');
  var d = (DATA && DATA.server) || {};
  var pinned = fd.filter(function(x){ return !!x.pinned; }).length;
  var sum = sp.reduce(function(a,b){ return a + (Number(b.amount)||0); }, 0);

  var h = '<div class="section-title">概览</div><div class="stat-grid">'+
    stat('服务器公告', ann.length, ann.length ? '最近 '+fmtDate(ann[0].date) : '暂无')+
    stat('赛事动态', fd.length, '置顶 '+pinned+' 条')+
    stat('赞助名单', sp.length, '合计 ¥'+sum)+
    stat('录像', rp.length, rp.length ? '最近 '+fmtDate(rp[0].date) : '暂无')+
    stat('图片素材', im.length, '')+
    stat('数据状态', DATA ? '已加载' : '未取到', DATA ? new Date(DATA_AT).toLocaleTimeString() : '点右上「刷新数据」重试')+
  '</div>';

  h += '<div class="section-title">公告按月分布</div><div class="card">';
  var months = {}, order = [];
  ann.forEach(function(a){
    var k = fmtDate(a.date).slice(0,7) || '未知';
    if(!months[k]){ months[k]=0; order.push(k); }
    months[k]++;
  });
  if(!order.length){ h += '<div class="muted">暂无公告数据</div>'; }
  else{
    var max = Math.max.apply(null, order.map(function(k){ return months[k]; }));
    order.sort().reverse().slice(0,8).forEach(function(k){
      h += '<div class="bar-row"><div class="lb">'+esc(k)+'</div><div class="bar-track"><div class="bar-fill" style="width:'+
        Math.round(months[k]/max*100)+'%"></div></div><div class="num">'+months[k]+'</div></div>';
    });
  }
  h += '<div class="muted" style="margin-top:12px">服务器：地址 '+esc(d.address||'-')+' · QQ 群 '+esc(d.qq||'-')+' · 开服 '+esc(d.start||'-')+'</div></div>';

  h += '<div class="section-title">最近公告与动态</div>';
  var recent = [];
  ann.slice(0,3).forEach(function(x){ recent.push({t:'公告', n:x.title || ('历史公告 '+fmtDate(x.date)), d:fmtDate(x.date)}); });
  fd.slice(0,4).forEach(function(x){ recent.push({t:'动态', n:x.title||'-', d:fmtDate(x.date)}); });

function bindSearch(){
  var map = { announce:'a_search', feed:'f_search', sponsor:'s_search', replay:'r_search', image:'i_search' };
  var id = map[CUR_TAB];
  if(!id) return;
  var inp = document.getElementById(id);
  if(!inp) return;
  var timer = null;
  inp.addEventListener('input', function(){
    var v = inp.value;
    clearTimeout(timer);
    timer = setTimeout(function(){
      SEARCH[CUR_TAB] = v;
      PAGE[CUR_TAB] = 1;
      var pos = inp.selectionStart;
      render();
      var again = document.getElementById(id);
      if(again){ again.focus(); try{ again.setSelectionRange(pos,pos); }catch(e){} }
    }, 260);
  });
}

/* 统一写：按钮锁 + 忙锁 + 成功后用服务端返回集合整体替换（不去 push，避免"传一次出多条"） */
function doWrite(action, payload, after){
  if(BUSY){ toast('还有操作正在进行','warn'); return; }
  busy(true, '提交中…');
  adminApi(action, payload).then(function(r){
    busy(false);
    if(!r || r.ok === false){
      toast('失败：' + (r && (r.error||r.message) || '未知错误'), 'err', 4200);
      return;
    }
    var key = COLL_KEY[action];
    if(key && Array.isArray(r[key])){
      DATA = DATA || {};
      DATA[key] = r[key];
      DATA_AT = Date.now();
    }else{
      loadData(true).then(function(){ render(); });
    }
    if(after) after();
    toast('已保存', 'ok');
    render();
  });
}
var COLL_KEY = {
  addAnnouncement:'announcements', updateAnnouncement:'announcements', deleteAnnouncement:'announcements',
  addFeed:'feeds', updateFeed:'feeds', deleteFeed:'feeds',
  addSponsor:'sponsors', updateSponsor:'sponsors', deleteSponsor:'sponsors',
  addReplay:'replays', updateReplay:'replays', deleteReplay:'replays',
  uploadImage:'images', deleteImage:'images'
};
var DEL_ACTION = { announce:'deleteAnnouncement', feed:'deleteFeed', sponsor:'deleteSponsor', replay:'deleteReplay', image:'deleteImage' };
function doDelete(kind, id){
  var act = DEL_ACTION[kind];
  if(!act) return;
  confirmBox({ title:'确认删除', desc:'删除后无法撤销，确定要删除这条内容吗？', okText:'删除', danger:true }).then(function(yes){
    if(!yes) return;
    busy(true, '删除中…');
    /* deleteXxx 的 id 放在 data 里（与 updateXxx 的顶层 id 不同） */
    adminApi(act, { data:{ id:id } }).then(function(r){
      busy(false);
      if(!r || r.ok === false){ toast('删除失败：' + ((r&&(r.error||r.message))||'未知错误'), 'err', 4200); return; }
      var key = COLL_KEY[act];
      if(key && Array.isArray(r[key])){ DATA[key] = r[key]; DATA_AT = Date.now(); }
      else{ loadData(true).then(function(){ render(); }); }
      toast('已删除', 'ok');
      render();
    });
  });
}
function uploadImage(){
  var name = ($('#i_name')||{}).value || '';
  var f = ($('#i_file')||{}).files && $('#i_file').files[0];
  if(!name.trim()){ toast('先填名称','warn'); return; }
  if(!f){ toast('先选择图片文件','warn'); return; }
  if(f.size > 1.5*1024*1024){ toast('文件超过 1.5MB，请先压缩','err'); return; }
  var fr = new FileReader();
  fr.onload = function(){
    busy(true, '上传中…');
    adminApi('uploadImage', { name:name, data:fr.result }).then(function(r){
      busy(false);
      if(!r || r.ok === false){ toast('上传失败：'+((r&&(r.error||r.message))||'未知错误'),'err',4200); return; }
      if(Array.isArray(r.images)){ DATA = DATA||{}; DATA.images = r.images; DATA_AT = Date.now(); }
      else{ loadData(true).then(function(){ render(); }); }
      toast('已上传', 'ok');
      render();
    });
  };
  fr.readAsDataURL(f);
}
function sendCmd(){
  var cmd = (($('#cmdInput')||{}).value || '').trim();
  if(!cmd){ toast('指令不能为空','warn'); return; }
  busy(true, '下发中…');
  fetch('/api/tst-cmd/send', {
    method:'POST',
    headers: Object.assign({ 'Content-Type':'application/json' }, authHeaders()),
    body: JSON.stringify({ cmd: cmd }),
    cache:'no-store'
  }).then(function(r){ return r.json(); }).then(function(j){
    busy(false);
    if(j && j.ok){ toast('已进入执行队列', 'ok'); var i=$('#cmdInput'); if(i) i.value=''; }
    else{ toast('下发失败：' + ((j&&(j.error||j.message))||'未知错误'), 'err', 4200); }
  }).catch(function(e){ busy(false); toast('下发失败：'+((e&&e.message)||e),'err',4200); });
}
function loadLogs(){
  var lv = ($('#logLevel')||{}).value || '';
  var q = ($('#logQ')||{}).value || '';
  var box = $('#logBox');
  if(box) box.textContent = '读取中…';
  var url = '/api/tst-log/list?limit=200' + (lv ? '&level='+encodeURIComponent(lv) : '') + (q ? '&q='+encodeURIComponent(q) : '');
  fetch(url, { headers: authHeaders(), cache:'no-store' }).then(function(r){ return r.json(); }).then(function(j){
    LOGS = (j && j.logs) || [];
    if(box) box.textContent = LOGS.length ? logText() : '没有匹配的日志';
  }).catch(function(e){ if(box) box.textContent = '读取失败：' + ((e&&e.message)||e); });
}
function loadEvents(){
  fetch('/api/tst-events/list?limit=60', { cache:'no-store' }).then(function(r){ return r.json(); }).then(function(j){
    EVENTS = (j && (j.events||j.list)) || [];
    render();
    toast(EVENTS.length ? ('读到 '+EVENTS.length+' 条事件') : '暂无事件', EVENTS.length?'ok':'warn');
  }).catch(function(e){ toast('读取失败：'+((e&&e.message)||e),'err'); });
}
function loadPerf(){
  fetch('/api/tst-perf/history', { cache:'no-store' }).then(function(r){ return r.json(); }).then(function(j){
    PERF = (j && (j.history||j.perf||j.items)) || [];
    render();
    toast(PERF.length ? ('读到 '+PERF.length+' 条采样') : '暂无采样', PERF.length?'ok':'warn');
  }).catch(function(e){ toast('读取失败：'+((e&&e.message)||e),'err'); });
}
function loadStatus(){
  fetch('/api/server-status', { cache:'no-store' }).then(function(r){ return r.json(); }).then(function(j){
    STATUS = j || null;
    if(CUR_TAB === 'server') render();
  }).catch(function(){ STATUS = null; });
}

/* ---------- 事件绑定 ---------- */
document.addEventListener('click', function(e){
  var t = e.target.closest ? e.target.closest('button') : null;
  if(!t) return;

  var tab = t.getAttribute('data-tab');
  if(tab){
    CUR_TAB = tab;
    render();
    if(tab === 'server'){ loadStatus(); }
    return;
  }

  if(t.getAttribute('data-refresh')){ busy(true,'刷新数据…'); loadData(true).then(function(){ busy(false); render(); toast('数据已刷新','ok'); }); return; }

  var pg = t.getAttribute('data-page');
  if(pg){
    var key = t.getAttribute('data-key');
    PAGE[key] = (PAGE[key]||1) + (pg === 'next' ? 1 : -1);
    if(PAGE[key] < 1) PAGE[key] = 1;
    render();
    return;
  }

  var edit = t.getAttribute('data-edit');
  if(edit){
    var id = t.getAttribute('data-id');
    var src = { announce:'announcements', feed:'feeds', sponsor:'sponsors', replay:'replays' }[edit];
    var item = S(src).filter(function(x){ return String(x.id) === String(id); })[0];
    if(item){ EDIT[edit] = item; render(); window.scrollTo({top:0,behavior:'smooth'}); }
    return;
  }

  var del = t.getAttribute('data-del');
  if(del){ doDelete(del, t.getAttribute('data-id')); return; }

  var sub = t.getAttribute('data-submit');
  if(sub){ if(sub==='announce') submitAnnounce(); else if(sub==='feed') submitFeed(); else if(sub==='sponsor') submitSponsor(); else if(sub==='replay') submitReplay(); return; }

  var ccl = t.getAttribute('data-cancel');
  if(ccl){ EDIT[ccl] = null; render(); return; }

  if(t.getAttribute('data-upload')){ uploadImage(); return; }
  if(t.getAttribute('data-cmd')){ sendCmd(); return; }
  var fill = t.getAttribute('data-cmdfill');
  if(fill){ var inp = $('#cmdInput'); if(inp){ inp.value = fill; inp.focus(); } return; }
  if(t.getAttribute('data-log')){ loadLogs(); return; }
  if(t.getAttribute('data-evt')){ loadEvents(); return; }
  if(t.getAttribute('data-perf')){ loadPerf(); return; }
});

$('#btnReload').addEventListener('click', function(){
  busy(true, '刷新数据…');
  loadData(true).then(function(){ busy(false); render(); toast(DATA ? '数据已刷新' : '仍然没取到数据', DATA?'ok':'err'); });
});
$('#gateRetry').addEventListener('click', function(){ location.reload(); });

/* ---------- 启动 ---------- */
checkAdmin().then(function(ok){
  if(!ok) return;
  return loadData(true).then(function(){
    render();
    loadStatus();
  });
});

})();
</script>
</body>
