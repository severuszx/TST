<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>管理员面板 - The Slow Tide</title>
<script>
(function(){
var mode=localStorage.getItem('tst-theme');
if(mode!=='dark'&&mode!=='light'){mode='light';}
document.documentElement.setAttribute('data-theme',mode);
})();
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
--bg:#f3f5f8;--text:#1f2937;--text-secondary:#5b6675;--border:#e2e8f0;
--card:#ffffff;--hover:#eef2f7;--header-bg:rgba(255,255,255,.92);
--primary:#0f172a;--accent:#52525b;--accent-soft:rgba(82,82,91,.1);
--shadow:0 4px 14px rgba(15,23,42,.07);
}
html[data-theme="dark"]{
--bg:#111113;--text:#e5e5e7;--text-secondary:#9a9aa0;--border:#26262b;
--card:#18181b;--hover:#222226;--header-bg:rgba(17,17,19,.92);
--primary:#f4f4f5;--accent:#a1a1aa;--accent-soft:rgba(161,161,170,.14);
--shadow:0 4px 14px rgba(0,0,0,.5);
}
body{background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.65;}
.container{max-width:1140px;margin:0 auto;padding:0 16px;}
a{color:var(--accent);}
button{font-family:inherit;}
.site-header{position:sticky;top:0;z-index:100;background:var(--header-bg);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);}
.header-inner{display:flex;align-items:center;gap:18px;min-height:62px;flex-wrap:wrap;}
.logo{font-size:20px;font-weight:700;color:var(--primary);display:flex;align-items:center;gap:8px;white-space:nowrap;text-decoration:none;}
.logo-img{width:34px;height:34px;border-radius:4px;object-fit:cover;flex:none;display:block;}
html[data-theme="dark"] .logo-img{filter:invert(1);}
.main-nav{display:flex;gap:2px;flex:1;flex-wrap:wrap;}
.nav-link{padding:8px 12px;border-radius:6px;border:none;background:transparent;color:var(--text);font-size:14px;cursor:pointer;white-space:nowrap;text-decoration:none;}
.nav-link:hover{background:var(--hover);}
.header-right{display:flex;align-items:center;gap:8px;margin-left:auto;flex-wrap:wrap;}
.btn{padding:8px 14px;border-radius:6px;border:1px solid var(--border);background:var(--card);color:var(--text);cursor:pointer;font-size:14px;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;}
.btn:hover{background:var(--hover);}
.btn-primary{background:#52525b;border:none;color:#fff;font-weight:600;}
html[data-theme="dark"] .btn-primary{background:#71717a;}
.btn-primary:hover{filter:brightness(1.06);}
.btn-danger{background:#fee2e2;border-color:#fecaca;color:#b91c1c;}
.btn-danger:hover{background:#fecaca;}
.btn-sm{padding:4px 10px;font-size:12px;}
.feedback-btn{padding:8px 14px;border-radius:6px;border:1px solid var(--border);background:var(--card);color:var(--text);font-weight:600;text-decoration:none;font-size:14px;white-space:nowrap;}
.feedback-btn:hover{background:var(--hover);}
.theme-toggle{position:relative;width:54px;height:28px;flex:none;border:1px solid var(--border);background:var(--card);border-radius:14px;cursor:pointer;padding:0;overflow:hidden;}
.theme-toggle .tt-ic{position:absolute;top:50%;transform:translateY(-50%);font-size:13px;line-height:1;pointer-events:none;}
.theme-toggle .tt-sun{left:8px;opacity:.75;}
.theme-toggle .tt-moon{right:8px;opacity:.75;}
.theme-toggle .tt-thumb{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--accent);transition:left .28s cubic-bezier(.4,0,.2,1);}
html[data-theme="dark"] .theme-toggle .tt-thumb{left:29px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:18px;box-shadow:var(--shadow);margin-bottom:16px;}
.form-row{margin:10px 0;}
.form-row label{display:block;font-size:13px;color:var(--text-secondary);margin-bottom:5px;}
.form-row input[type="text"],.form-row input[type="password"],.form-row textarea,.form-row select{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);font-size:14px;outline:none;font-family:inherit;}
.form-row input:focus,.form-row textarea:focus,.form-row select:focus{border-color:var(--accent);}
.form-row textarea{min-height:90px;resize:vertical;}
.form-row .hint{font-size:12px;color:var(--text-secondary);margin-top:4px;}
.form-check{display:flex;align-items:center;gap:6px;font-size:14px;}
.admin-tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;}
.admin-tab{padding:7px 14px;border:1px solid var(--border);border-radius:6px;background:var(--card);cursor:pointer;font-size:14px;color:var(--text);}
.admin-tab.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;}
.admin-pane{display:none;}
.admin-pane.active{display:block;}
.admin-list-item{display:flex;align-items:flex-start;gap:10px;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);}
.admin-list-item:last-child{border-bottom:none;}
.admin-list-item .meta{font-size:13px;color:var(--text-secondary);}
.admin-list-item .ops{flex:none;display:flex;gap:6px;}
.admin-list-item img{max-width:120px;border-radius:4px;margin-top:6px;}
.empty-hint{color:var(--text-secondary);font-size:14px;padding:10px 0;}
.img-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;}
.img-item{background:var(--bg);border:1px solid var(--border);border-radius:6px;padding:8px;overflow:hidden;display:flex;flex-direction:column;gap:6px;}
.img-item img{width:100%;height:100px;object-fit:cover;border-radius:4px;display:block;}
.img-item .im-name{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.img-item .im-meta{font-size:11px;color:var(--text-secondary);}
.img-preview{max-width:200px;border-radius:6px;margin-top:8px;border:1px solid var(--border);}
.section-title{font-size:21px;font-weight:700;margin:20px 0 16px;color:var(--primary);}
.site-footer{margin-top:40px;padding:30px 0 18px;border-top:1px solid var(--border);}
.footer-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:24px;}
.footer-col h4{font-size:15px;margin-bottom:8px;}
.footer-col p{font-size:13px;color:var(--text-secondary);}
.footer-links{list-style:none;font-size:13px;color:var(--text-secondary);line-height:2;}
.footer-links a{color:var(--accent);text-decoration:none;}
.footer-links a:hover{text-decoration:underline;}
.footer-bottom{text-align:center;padding-top:16px;border-top:1px solid var(--border);font-size:13px;color:var(--text-secondary);margin-top:16px;}
.toast-wrap{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:999;display:flex;flex-direction:column;gap:8px;align-items:center;}
.toast-item{background:var(--primary);color:#fff;padding:10px 20px;border-radius:8px;font-size:14px;box-shadow:var(--shadow);}
.login-box{max-width:400px;margin:60px auto;}
@media(max-width:768px){.footer-grid{grid-template-columns:1fr;}}
</style>
</head>
<body>
<header class="site-header">
<div class="container header-inner">
<a class="logo" href="index.html"><img src="logo.jpg" alt="The Slow Tide" class="logo-img"> The Slow Tide</a>

<main>
<div class="container">
<h2 class="section-title">管理员面板</h2>
<div id="loginBox" class="login-box">
<div class="card">
<div class="form-row"><label>管理员密码</label><input type="password" id="adminPwd" placeholder="请输入管理员密码"></div>

<button class="admin-tab" data-tab="sponsor">赞助管理</button>

<div class="form-row"><label>公告内容</label><textarea id="anContent" placeholder="公告内容（支持多行）"></textarea></div>
<div class="form-row"><label>日期（留空为今天）</label><input type="text" id="anDate" placeholder="如 2026-09-13"></div>
<button class="btn btn-primary" id="anAddBtn">发布公告</button>
<button class="btn" id="anCancelBtn" style="display:none;">取消编辑</button>
</div>
<div id="anList"></div>
</div>
<div class="admin-pane" id="paneFeed">
<div class="card">
<div class="form-row"><label>动态标题</label><input type="text" id="fdTitle" placeholder="动态标题"></div>
<div class="form-row"><label>动态内容</label><textarea id="fdContent" placeholder="动态内容（支持多行）"></textarea></div>
<div class="form-row"><label>配图（可选，不超过1.5MB）</label><input type="file" id="fdImage" accept="image/*"></div>
<div class="img-preview" id="fdImgPreview" style="display:none;"><img id="fdImgPreviewImg" alt="预览" style="max-width:100%;"></div>
<div class="form-row"><label>配图引用（可选，如 img:xxx）</label><input type="text" id="fdImageRef" placeholder="或粘贴图片管理中的引用"></div>
<div class="form-row form-check"><input type="checkbox" id="fdPinned"> 置顶此动态</div>
<div class="form-row"><label>日期（留空为今天）</label><input type="text" id="fdDate" placeholder="如 2026-09-13"></div>
<button class="btn btn-primary" id="fdAddBtn">发布动态</button>
<button class="btn" id="fdCancelBtn" style="display:none;">取消编辑</button>
</div>
<div id="fdList"></div>
</div>
<div class="admin-pane" id="paneSponsor">
<div class="card">
<div class="form-row"><label>玩家名</label><input type="text" id="spName" placeholder="玩家名"></div>
<div class="form-row"><label>赞助金额</label><input type="text" id="spAmount" placeholder="如 5.00"></div>
<button class="btn btn-primary" id="spAddBtn">添加赞助记录</button>
<button class="btn" id="spCancelBtn" style="display:none;">取消编辑</button>
</div>
<div id="spList"></div>
</div>
<div class="admin-pane" id="paneReplay">
<div class="card">
<div class="form-row"><label>回放标题</label><input type="text" id="rpTitle" placeholder="如 裂痕杯 1/8 决赛"></div>
<div class="form-row"><label>视频链接</label><input type="text" id="rpUrl" placeholder="mp4/webm 直链，或 B站链接"></div>
<div class="form-row"><label>日期（留空为今天）</label><input type="text" id="rpDate" placeholder="如 2026-09-13"></div>
<button class="btn btn-primary" id="rpAddBtn">发布回放</button>
<button class="btn" id="rpCancelBtn" style="display:none;">取消编辑</button>
</div>
<div id="rpList"></div>
</div>
<div class="admin-pane" id="paneImage">
<div class="card">
<div class="form-row"><label>选择图片（不超过1.5MB）</label><input type="file" id="imFile" accept="image/*"></div>
<div class="form-row"><label>图片名称（可选）</label><input type="text" id="imName" placeholder="如 裂痕杯宣传图"></div>
<button class="btn btn-primary" id="imUploadBtn">上传图片</button>
<div class="hint" style="font-size:12px;color:var(--text-secondary);margin-top:6px;">上传后复制引用 img:xxx，可粘贴到动态配图字段</div>
</div>
<div id="imList"></div>
</div>
<div class="admin-pane" id="paneLottery">
<div class="card">
<div class="form-row"><label>管理员密码（后端校验）</label><input type="password" id="ltPwd" placeholder="请输入管理员密码"></div>
<div class="form-row"><label>新增兑换码</label>
<div style="display:flex;gap:8px;flex-wrap:wrap;">
<input type="text" id="ltCode" placeholder="兑换码（8位字母）" style="flex:1;min-width:110px;">
<input type="text" id="ltPrize" placeholder="奖品名" style="flex:1;min-width:110px;">
<input type="text" id="ltWeight" placeholder="权重（越小越稀有）" style="width:110px;">
<button class="btn btn-primary" id="ltAddBtn">添加</button>
</div>
</div>
<div class="hint" style="font-size:12px;color:var(--text-secondary);margin-top:6px;">权重越小越难抽中。已使用的兑换码不可删除，仅可查看。</div>
<button class="btn" id="ltRefreshBtn" style="margin-top:10px;">刷新列表</button>
</div>
<div id="ltList"></div>
</div>
</div>
</div>

<script>
const $=s=>document.querySelector(s);
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function showToast(msg){const w=$('#toastWrap');const d=document.createElement('div');d.className='toast-item';d.textContent=msg;w.appendChild(d);setTimeout(()=>{d.style.opacity='0';d.style.transition='opacity .3s';},2200);setTimeout(()=>d.remove(),2600);}
function themeState(){const v=localStorage.getItem('tst-theme');return(v==='dark'||v==='light')?v:'light';}
function applyTheme(){document.documentElement.setAttribute('data-theme',themeState());}
$('#themeToggle').onclick=()=>{localStorage.setItem('tst-theme',themeState()==='dark'?'light':'dark');applyTheme();};
let SITE_DATA={announcements:[],feeds:[],sponsors:[],replays:[],images:[]};
let ADMIN_TOKEN=sessionStorage.getItem('tst_admin_token')||'';
async function loadData(){
try{const r=await fetch('https://tst-server-site.pages.dev/api/data');const d=await r.json();
SITE_DATA={announcements:d.announcements||[],feeds:d.feeds||[],sponsors:d.sponsors||[],replays:d.replays||[],images:d.images||[]};
}catch(e){showToast('数据加载失败');}
}
async function adminApi(action,data,extra){
const r=await fetch('https://tst-server-site.pages.dev/api/admin',{method:'POST',
headers:{'Content-Type':'application/json','Authorization':'Bearer '+ADMIN_TOKEN},
body:JSON.stringify({action,data,...(extra||{})})});
const d=await r.json();
if(!d.ok&&r.status===401){ADMIN_TOKEN='';sessionStorage.removeItem('tst_admin_token');showToast('登录已过期');$('#loginBox').style.display='block';$('#adminPanel').style.display='none';return null;}
return d;
}
$('#adminLoginBtn').onclick=async()=>{
const pwd=$('#adminPwd').value;if(!pwd){showToast('请输入密码');return;}
const r=await fetch('https://tst-server-site.pages.dev/api/admin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'login',password:pwd})});
const d=await r.json();
if(d.ok){ADMIN_TOKEN=d.token;sessionStorage.setItem('tst_admin_token',ADMIN_TOKEN);showToast('登录成功');showAdminPanel();}
else{showToast(d.error||'登录失败');}
};
$('#adminPwd').addEventListener('keydown',e=>{if(e.key==='Enter')$('#adminLoginBtn').click();});
function showAdminPanel(){$('#loginBox').style.display='none';$('#adminPanel').style.display='block';refreshLists();}
document.querySelectorAll('.admin-tab').forEach(t=>{t.onclick=()=>{document.querySelectorAll('.admin-tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.admin-pane').forEach(x=>x.classList.remove('active'));t.classList.add('active');$('#pane'+t.dataset.tab.charAt(0).toUpperCase()+t.dataset.tab.slice(1)).classList.add('active');};});
function resolveImg(src){if(typeof src==='string'&&src.startsWith('img:')&&Array.isArray(SITE_DATA.images)){const it=SITE_DATA.images.find(x=>x.id===src.slice(4));if(it)return it.data;}return src;}
async function refreshLists(){await loadData();renderNotices();renderFeeds();renderSponsors();renderReplays();renderImages();renderLottery();}
function lotteryApi(action,payload){
  const pwd=$('#ltPwd').value.trim();
  if(!pwd){showToast('请输入管理员密码');return Promise.resolve(null);}
  return fetch('/api/rest/rpc/admin_lottery',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pwd,action,payload:payload||{}})}).then(r=>r.json()).catch(()=>{showToast('请求失败');return null;});
}
async function renderLottery(){
  const el=$('#ltList');if(!el)return;
  const pwd=$('#ltPwd').value.trim();
  if(!pwd){el.innerHTML='<div class="empty-hint">输入管理员密码后点「刷新列表」查看兑换码池</div>';return;}
  const d=await lotteryApi('list');
  if(!d)return;
  if(!d.ok){el.innerHTML='<div class="empty-hint">'+(d.error==='bad_password'?'密码错误':'加载失败')+'</div>';return;}
  const list=d.codes||[];
  el.innerHTML=list.map(c=>'<div class="admin-list-item"><div><strong>'+esc(c.prize)+'</strong> <span class="meta">#'+esc(c.seq)+'</span><div class="meta">码：'+esc(c.code)+' · 权重 '+esc(c.weight)+'</div>'+(c.claimed?'<div class="meta" style="color:#b91c1c;">已使用'+(c.claimed_at_cn?' · '+esc(c.claimed_at_cn):'')+'</div>':'<div class="meta" style="color:#047857;">未使用</div>')+'</div><div class="ops">'+(c.claimed?'<button class="btn btn-sm" disabled>已使用</button>':'<button class="btn btn-sm" data-lt-w="'+esc(c.id)+'">改权重</button><button class="btn btn-sm" data-lt-p="'+esc(c.id)+'">改奖品</button><button class="btn btn-sm btn-danger" data-lt-del="'+esc(c.id)+'">删除</button>')+'</div></div>').join('')||'<div class="empty-hint">暂无兑换码</div>';
}
$('#ltRefreshBtn').onclick=renderLottery;
$('#ltAddBtn').onclick=async()=>{
  const code=$('#ltCode').value.trim(),prize=$('#ltPrize').value.trim(),weight=$('#ltWeight').value.trim();
  if(!code||!prize||!weight){showToast('请填写码、奖品名和权重');return;}
  const d=await lotteryApi('add',{code,prize,weight:parseInt(weight,10)});
  if(!d)return;
  if(!d.ok){showToast(d.error==='code_exists'?'兑换码已存在':(d.error==='bad_password'?'密码错误':'添加失败'));return;}
  $('#ltCode').value='';$('#ltPrize').value='';$('#ltWeight').value='';
  showToast('已添加');renderLottery();
};
document.addEventListener('click',async e=>{
  const w=e.target.closest('[data-lt-w]');
  if(w){const v=prompt('输入新权重（越小越稀有）');if(v===null)return;const n=parseInt(v,10);if(!(n>0)){showToast('权重需为正整数');return;}const d=await lotteryApi('update_weight',{id:w.dataset.ltW,weight:n});if(d&&d.ok){showToast('权重已更新');renderLottery();}else if(d){showToast(d.error==='bad_password'?'密码错误':'更新失败');}return;}
  const p=e.target.closest('[data-lt-p]');
  if(p){const v=prompt('输入新奖品名');if(v===null)return;const s=v.trim();if(!s){showToast('奖品名不能为空');return;}const d=await lotteryApi('update_prize',{id:p.dataset.ltP,prize:s});if(d&&d.ok){showToast('奖品已更新');renderLottery();}else if(d){showToast(d.error==='bad_password'?'密码错误':'更新失败');}return;}
  const del=e.target.closest('[data-lt-del]');
  if(del){if(!confirm('确定删除此兑换码？'))return;const d=await lotteryApi('delete',{id:del.dataset.ltDel});if(d&&d.ok){showToast('已删除');renderLottery();}else if(d){showToast(d.error==='already_claimed'?'该码已使用，无法删除':(d.error==='bad_password'?'密码错误':'删除失败'));}return;}
});
function renderNotices(){const list=SITE_DATA.announcements||[];$('#anList').innerHTML=list.map(a=>'<div class="admin-list-item"><div><strong>'+esc(a.title)+'</strong><div class="meta">'+esc(a.date||'')+'</div><div style="font-size:13px;color:var(--text-secondary);margin-top:4px;">'+esc(a.content)+'</div></div><div class="ops"><button class="btn btn-sm" data-edit="announcement" data-id="'+esc(a.id)+'">编辑</button><button class="btn btn-sm btn-danger" data-del="announcement" data-id="'+esc(a.id)+'">删除</button></div></div>').join('')||'<div class="empty-hint">暂无公告</div>';}
function renderFeeds(){const list=SITE_DATA.feeds||[];$('#fdList').innerHTML=list.map(f=>'<div class="admin-list-item"><div><strong>'+esc(f.title)+(f.pinned?' <span style="color:#b91c1c;">置顶</span>':'')+'</strong><div class="meta">'+esc(f.date||'')+'</div><div style="font-size:13px;color:var(--text-secondary);margin-top:4px;">'+esc(f.content)+'</div>'+(f.image?'<img src="'+esc(resolveImg(f.image))+'" alt="">':'')+'</div><div class="ops"><button class="btn btn-sm" data-edit="feed" data-id="'+esc(f.id)+'">编辑</button><button class="btn btn-sm btn-danger" data-del="feed" data-id="'+esc(f.id)+'">删除</button></div></div>').join('')||'<div class="empty-hint">暂无动态</div>';}
function renderSponsors(){const list=SITE_DATA.sponsors||[];$('#spList').innerHTML=list.map(s=>'<div class="admin-list-item"><div><strong>'+esc(s.name)+'</strong> <span class="meta">赞助 '+esc(s.amount)+'</span></div><div class="ops"><button class="btn btn-sm" data-edit="sponsor" data-id="'+esc(s.id)+'">编辑</button><button class="btn btn-sm btn-danger" data-del="sponsor" data-id="'+esc(s.id)+'">删除</button></div></div>').join('')||'<div class="empty-hint">暂无赞助记录</div>';}
function renderReplays(){const list=SITE_DATA.replays||[];$('#rpList').innerHTML=list.map(r=>'<div class="admin-list-item"><div><strong>'+esc(r.title)+'</strong><div class="meta">'+esc(r.date||'')+'</div><div style="font-size:13px;color:var(--text-secondary);margin-top:4px;word-break:break-all;">'+esc(r.url)+'</div></div><div class="ops"><button class="btn btn-sm" data-edit="replay" data-id="'+esc(r.id)+'">编辑</button><button class="btn btn-sm btn-danger" data-del="replay" data-id="'+esc(r.id)+'">删除</button></div></div>').join('')||'<div class="empty-hint">暂无赛事回放</div>';}
function renderImages(){const list=SITE_DATA.images||[];$('#imList').innerHTML='<div class="img-grid">'+list.map(im=>'<div class="img-item"><img src="'+esc(im.data)+'" alt=""><div class="im-name">'+esc(im.name||im.id)+'</div><div class="im-meta">'+esc(im.id)+'</div><div style="display:flex;gap:5px;"><button class="btn btn-sm" data-copy="img:'+esc(im.id)+'">复制引用</button><button class="btn btn-sm btn-danger" data-del-img="'+esc(im.id)+'">删除</button></div></div>').join('')+'</div>';}
document.addEventListener('click',async e=>{
const del=e.target.closest('[data-del]');
if(del&&ADMIN_TOKEN){const kind=del.dataset.del,id=del.dataset.id;const action=kind==='announcement'?'deleteAnnouncement':kind==='feed'?'deleteFeed':kind==='sponsor'?'deleteSponsor':'deleteReplay';if(!confirm('确定删除？'))return;const d=await adminApi(action,{id});if(d&&d.ok){if(d.announcements)SITE_DATA.announcements=d.announcements;if(d.feeds)SITE_DATA.feeds=d.feeds;if(d.sponsors)SITE_DATA.sponsors=d.sponsors;if(d.replays)SITE_DATA.replays=d.replays;showToast('已删除');refreshLists();}return;}
const delImg=e.target.closest('[data-del-img]');
if(delImg&&ADMIN_TOKEN){if(!confirm('确定删除这张图片？'))return;const d=await adminApi('deleteImage',{id:delImg.dataset.delImg});if(d&&d.ok){SITE_DATA.images=d.images||[];showToast('图片已删除');renderImages();}return;}
const copy=e.target.closest('[data-copy]');
if(copy){navigator.clipboard.writeText(copy.dataset.copy).then(()=>showToast('已复制: '+copy.dataset.copy));return;}
});
let editingAn=null,editingFd=null,editingSp=null,editingRp=null;
document.addEventListener('click',e=>{
const eb=e.target.closest('[data-edit]');if(!eb||!ADMIN_TOKEN)return;const kind=eb.dataset.edit,id=eb.dataset.id;
if(kind==='announcement'){const a=SITE_DATA.announcements.find(x=>x.id===id);if(!a)return;$('#anTitle').value=a.title;$('#anContent').value=a.content;$('#anDate').value=a.date||'';editingAn=id;$('#anAddBtn').textContent='保存修改';$('#anCancelBtn').style.display='';}
else if(kind==='feed'){const f=SITE_DATA.feeds.find(x=>x.id===id);if(!f)return;$('#fdTitle').value=f.title;$('#fdContent').value=f.content;$('#fdDate').value=f.date||'';$('#fdPinned').checked=!!f.pinned;$('#fdImage').value='';fdImageData=null;if(f.image){$('#fdImgPreviewImg').src=resolveImg(f.image);$('#fdImgPreview').style.display='block';$('#fdImageRef').value=f.image.startsWith('img:')?f.image:'';}else{$('#fdImgPreview').style.display='none';$('#fdImageRef').value='';}editingFd=id;$('#fdAddBtn').textContent='保存修改';$('#fdCancelBtn').style.display='';}
else if(kind==='sponsor'){const s=SITE_DATA.sponsors.find(x=>x.id===id);if(!s)return;$('#spName').value=s.name;$('#spAmount').value=s.amount;editingSp=id;$('#spAddBtn').textContent='保存修改';$('#spCancelBtn').style.display='';}
else if(kind==='replay'){const r=SITE_DATA.replays.find(x=>x.id===id);if(!r)return;$('#rpTitle').value=r.title;$('#rpUrl').value=r.url;$('#rpDate').value=r.date||'';editingRp=id;$('#rpAddBtn').textContent='保存修改';$('#rpCancelBtn').style.display='';}
});
$('#anCancelBtn').onclick=()=>{editingAn=null;$('#anAddBtn').textContent='发布公告';$('#anCancelBtn').style.display='none';$('#anTitle').value='';$('#anContent').value='';$('#anDate').value='';};
$('#anAddBtn').onclick=async()=>{const title=$('#anTitle').value.trim(),content=$('#anContent').value.trim(),date=$('#anDate').value.trim();if(!title||!content){showToast('请填写标题和内容');return;}const d=editingAn?await adminApi('updateAnnouncement',{title,content,date:date||undefined},{id:editingAn}):await adminApi('addAnnouncement',{title,content,date:date||undefined});if(d&&d.ok){SITE_DATA.announcements=d.announcements;$('#anCancelBtn').click();showToast(editingAn?'公告已更新':'公告已发布');renderNotices();}};
let fdImageData=null;
$('#fdImage').addEventListener('change',e=>{const file=e.target.files[0];if(!file){fdImageData=null;$('#fdImgPreview').style.display='none';return;}if(file.size>1.5*1024*1024){showToast('图片超过1.5MB');e.target.value='';return;}const reader=new FileReader();reader.onload=()=>{fdImageData=reader.result;$('#fdImgPreviewImg').src=fdImageData;$('#fdImgPreview').style.display='block';};reader.readAsDataURL(file);});
$('#fdCancelBtn').onclick=()=>{editingFd=null;$('#fdAddBtn').textContent='发布动态';$('#fdCancelBtn').style.display='';$('#fdTitle').value='';$('#fdContent').value='';$('#fdDate').value='';$('#fdPinned').checked=false;$('#fdImage').value='';fdImageData=null;$('#fdImgPreview').style.display='none';$('#fdImageRef').value='';};
$('#fdAddBtn').onclick=async()=>{const title=$('#fdTitle').value.trim(),content=$('#fdContent').value.trim(),date=$('#fdDate').value.trim(),pinned=$('#fdPinned').checked,ref=$('#fdImageRef').value.trim();if(!title||!content){showToast('请填写标题和内容');return;}const imgVal=fdImageData||ref||undefined;const d=editingFd?await adminApi('updateFeed',{title,content,image:imgVal,pinned,date:date||undefined},{id:editingFd}):await adminApi('addFeed',{title,content,image:imgVal,pinned,date:date||undefined});if(d&&d.ok){SITE_DATA.feeds=d.feeds;$('#fdCancelBtn').click();showToast(editingFd?'动态已更新':'动态已发布');renderFeeds();}};
$('#spCancelBtn').onclick=()=>{editingSp=null;$('#spAddBtn').textContent='添加赞助记录';$('#spCancelBtn').style.display='none';$('#spName').value='';$('#spAmount').value='';};
$('#spAddBtn').onclick=async()=>{const name=$('#spName').value.trim(),amount=$('#spAmount').value.trim();if(!name||!amount){showToast('请填写玩家名和金额');return;}const d=editingSp?await adminApi('updateSponsor',{name,amount},{id:editingSp}):await adminApi('addSponsor',{name,amount});if(d&&d.ok){SITE_DATA.sponsors=d.sponsors;$('#spCancelBtn').click();showToast(editingSp?'赞助已更新':'赞助已添加');renderSponsors();}};
$('#rpCancelBtn').onclick=()=>{editingRp=null;$('#rpAddBtn').textContent='发布回放';$('#rpCancelBtn').style.display='none';$('#rpTitle').value='';$('#rpUrl').value='';$('#rpDate').value='';};
$('#rpAddBtn').onclick=async()=>{const title=$('#rpTitle').value.trim(),url=$('#rpUrl').value.trim(),date=$('#rpDate').value.trim();if(!title||!url){showToast('请填写标题和视频链接');return;}const d=editingRp?await adminApi('updateReplay',{title,url,date:date||undefined},{id:editingRp}):await adminApi('addReplay',{title,url,date:date||undefined});if(d&&d.ok){SITE_DATA.replays=d.replays;$('#rpCancelBtn').click();showToast(editingRp?'回放已更新':'回放已发布');renderReplays();}};
$('#imUploadBtn').onclick=async()=>{const file=$('#imFile').files[0];if(!file){showToast('请选择图片');return;}if(file.size>1.5*1024*1024){showToast('图片超过1.5MB');return;}const name=$('#imName').value.trim();const reader=new FileReader();reader.onload=async()=>{const d=await adminApi('uploadImage',{file:reader.result,name:name||undefined});if(d&&d.ok){SITE_DATA.images=d.images||[];$('#imFile').value='';$('#imName').value='';showToast('图片上传成功');renderImages();}};reader.readAsDataURL(file);};
applyTheme();if(ADMIN_TOKEN){showAdminPanel();}
</script>
</body>
</html>
