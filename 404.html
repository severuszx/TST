<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>页面不存在 - The Slow Tide</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#111113;color:#e5e5e7;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.8;}
.box{max-width:560px;padding:40px 24px;}
.code{font-size:88px;font-weight:800;background:linear-gradient(135deg,#f4f4f5 0%,#a1a1aa 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
.t{font-size:22px;font-weight:700;margin:10px 0 6px;}
.d{color:#9a9aa0;font-size:14px;margin-bottom:24px;}
a.btn{display:inline-block;padding:10px 26px;border-radius:8px;background:#71717a;color:#fff;text-decoration:none;font-size:14px;}
a.btn:hover{filter:brightness(1.1);}
</style>
</head>
<body>
<div class="box">
<div class="code">404</div>
<div class="t">页面不存在或已移动</div>
<div class="d">你访问的地址没有对应的页面，可能已被删除或迁移。</div>
<a class="btn" href="/">返回官网首页</a>
</div>
</body>
</html>
