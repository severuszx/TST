<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>积分商店 - The Slow Tide</title>
<style>
:root{color-scheme:light;--bg:#f3f5f8;--text:#1f2937;--text-secondary:#5b6675;--border:#e2e8f0;--card:#ffffff;--hover:#eef2f7;--header-bg:rgba(255,255,255,.92);--primary:#0f172a;--accent:#52525b;--accent-soft:rgba(82,82,91,.1);--shadow:0 4px 14px rgba(15,23,42,.07);--ok:#16a34a;--warn:#b45309;--danger:#dc2626;}
html[data-theme="dark"]{color-scheme:dark;--bg:#111113;--text:#e5e5e7;--text-secondary:#9a9aa0;--border:#26262b;--card:#18181b;--hover:#222226;--header-bg:rgba(17,17,19,.92);--primary:#f4f4f5;--accent:#a1a1aa;--accent-soft:rgba(161,161,170,.14);--shadow:0 4px 14px rgba(0,0,0,.5);--ok:#4ade80;--warn:#fbbf24;--danger:#f87171;}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px;line-height:1.6;}
a{color:var(--text);text-decoration:none}
/* 官网风格导航 */
.topbar{position:sticky;top:0;z-index:60;background:var(--header-bg);backdrop-filter:none;border-bottom:1px solid var(--border);padding:10px 22px;display:flex;align-items:center;gap:10px;}
.topbar .logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;color:var(--text);}
.topbar .logo img{width:28px;height:28px;border-radius:6px;object-fit:cover;}
.topbar .links{display:flex;gap:4px;margin-left:10px;flex-wrap:wrap;}
.topbar .links a{padding:6px 12px;border-radius:8px;color:var(--text-secondary);font-size:14px;font-weight:500;}
.topbar .links a:hover{color:var(--text);background:var(--hover);}
.topbar .links a.active{color:var(--primary);background:var(--accent-soft);font-weight:600;}
.topbar .right{margin-left:auto;display:flex;align-items:center;gap:8px;}
.points-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border:1px solid var(--border);border-radius:20px;background:var(--card);cursor:pointer;font-size:13px;font-weight:600;color:var(--warn);}
.points-badge:hover{border-color:var(--accent);}
.points-badge .plbl{font-size:12px;color:var(--text-secondary);font-weight:400;}
.fb-btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;}
.fb-btn:hover{border-color:var(--accent);color:var(--primary);}
.fb-btn.primary{background:var(--primary);color:#fff;border-color:var(--primary);}
.fb-btn.primary:hover{opacity:.9;}
.u-name{font-size:13px;font-weight:600;color:var(--text);max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.wrap{max-width:1120px;margin:0 auto;padding:24px 22px 60px;}
/* 主区布局：左栏分类 + 右内容 */
.shop-layout{display:flex;gap:18px;align-items:flex-start;}
.sidebar{flex:0 0 168px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 0;box-shadow:var(--shadow);position:sticky;top:64px;}
.sidebar .sb-item{display:block;width:100%;padding:10px 18px;font-size:14px;color:var(--text-secondary);cursor:pointer;border:none;background:none;text-align:left;font-weight:500;}
.sidebar .sb-item:hover{background:var(--hover);color:var(--text);}
.sidebar .sb-item.active{background:var(--accent-soft);color:var(--primary);font-weight:600;border-left:3px solid var(--accent);}
.sidebar .sb-head{font-size:12px;color:var(--text-secondary);padding:6px 18px 8px;font-weight:600;border-bottom:1px solid var(--border);margin-bottom:6px;}
.main{flex:1;min-width:0;}
.section-title{font-size:18px;font-weight:700;color:var(--text);margin:0 0 14px;position:relative;padding-left:12px;}
.section-title::before{content:'';position:absolute;left:0;top:3px;bottom:3px;width:4px;border-radius:2px;background:var(--accent);}
.panel{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:16px;box-shadow:var(--shadow);}
.panel h3{margin-bottom:12px;font-size:15px;color:var(--text);}
.load-box{display:flex;align-items:center;justify-content:center;gap:10px;padding:36px 0;color:var(--text-secondary);font-size:14px;}
.load-spinner{width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;flex-shrink:0;}
@keyframes spin{to{transform:rotate(360deg)}}
.empty-hint{color:var(--text-secondary);font-size:14px;padding:16px 0;text-align:center;}
/* 商品网格 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:14px;}
.item{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow);transition:border-color .15s;}
.item:hover{border-color:var(--accent);}
.item .ic{width:64px;height:64px;object-fit:contain;margin:0 auto;image-rendering:pixelated;}
.item .nm{font-weight:700;text-align:center;line-height:1.3;color:var(--text);}
.item .ds{font-size:12px;color:var(--text-secondary);text-align:center;line-height:1.5;min-height:34px;}
.item .pr{text-align:center;color:var(--warn);font-weight:700;font-size:15px;}
.item .quota{text-align:center;font-size:12px;color:var(--text-secondary);min-height:16px;}
.item .quota.soldout{color:var(--danger);}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:8px 14px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);font-size:13px;cursor:pointer;font-weight:600;transition:all .15s;}
.btn:hover{border-color:var(--accent);color:var(--primary);}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff;width:100%;}
.btn.primary:hover{opacity:.9;}
.btn.danger{color:var(--danger);}
.btn:disabled{opacity:.5;cursor:not-allowed;}
/* 表格 */
.table{width:100%;border-collapse:collapse;font-size:13px;}
.table th,.table td{padding:8px 10px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top;}
.table th{color:var(--text-secondary);font-weight:600;font-size:12px;}
.code{font-family:Consolas,monospace;color:var(--warn);}
.pos{color:var(--ok);font-weight:600;}
.neg{color:var(--danger);font-weight:600;}
/* 弹窗 */
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:100;}
.modal-mask.show{display:flex;}
.modal{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:22px;width:440px;max-width:92vw;box-shadow:var(--shadow);max-height:86vh;overflow:auto;}
.modal h3{margin-bottom:14px;font-size:16px;}
.modal .m-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;}
/* 积分明细/获取方式 */
.pt-item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px;}
.pt-item:last-child{border-bottom:none;}
.pt-item .pt-r{flex:1;color:var(--text);}
.pt-item .pt-d{color:var(--text-secondary);font-size:12px;}
.pt-item .pt-a{font-weight:600;}
.pt-item .pt-a.pos{color:var(--ok);}
.pt-item .pt-a.neg{color:var(--danger);}
.way-card{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:10px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;}
.way-card:hover{border-color:var(--accent);}
.way-card .w-t{font-weight:600;font-size:14px;color:var(--text);}
.way-card .w-s{font-size:12px;color:var(--text-secondary);margin-top:2px;}
.way-card .w-arrow{color:var(--text-secondary);font-size:16px;}
.form-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;}
.form-grid label{display:block;font-size:12px;color:var(--text-secondary);margin-bottom:4px;}
.form-grid input,.form-grid select,.form-grid textarea{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:13px;}
.form-grid textarea{min-height:70px;font-family:Consolas,monospace;font-size:12px;}
.form-row{margin-bottom:12px;}
.form-row label{display:block;font-size:12px;color:var(--text-secondary);margin-bottom:4px;}
.form-row input,.form-row select,.form-row textarea{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:13px;}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%);background:var(--primary);color:var(--bg);padding:10px 20px;border-radius:9px;font-size:13px;font-weight:600;z-index:200;opacity:0;transition:opacity .2s;pointer-events:none;}
.toast.show{opacity:1;}
@media(max-width:760px){.shop-layout{flex-direction:column;}.sidebar{flex:none;width:100%;position:static;display:flex;flex-wrap:wrap;padding:8px;}.sidebar .sb-head{display:none;}.sidebar .sb-item{width:auto;padding:8px 14px;border-radius:8px;}.sidebar .sb-item.active{border-left:none;background:var(--accent-soft);}}
</style>
</head>
<body>
<div class="topbar">
  <a class="logo" href="index.html"><img id="navLogo" alt="logo"><span>The Slow Tide</span></a>
  <div class="links">
    <a href="index.html">首页</a>
    <a href="shop.html" class="active">积分商店</a>
    <a href="profile.html">个人中心</a>
  </div>
  <div class="right">
    <span class="points-badge" id="ptsBadge" onclick="openPointsModal()" title="点击查看积分明细"><span class="plbl">积分</span><span id="ptsNum">--</span></span>
    <button class="fb-btn" id="themeBtn" title="切换主题">主题</button>
    <span class="u-name" id="uName" style="display:none;"></span>
    <button class="fb-btn" id="uBtn" style="display:none;">退出</button>
  </div>
</div>

<div class="wrap" id="gateWrap" style="display:none;">
  <div class="panel" style="max-width:460px;margin:60px auto;text-align:center;padding:36px;">
    <h3 style="font-size:18px;">请先登录</h3>
    <p class="empty-hint">积分商店需要登录官网账号后才能使用<br>登录后可兑换商品、查看积分明细</p>
    <button class="btn primary" style="width:auto;padding:10px 30px;margin-top:8px;" onclick="location.href='login.html'">去登录</button>
  </div>
</div>

<div class="wrap" id="mainWrap" style="display:none;">
  <div class="panel" style="display:flex;align-items:center;gap:10px;padding:12px 16px;">
    <span style="font-size:13px;color:var(--text-secondary);">每日签到与投币入口：</span>
    <a class="btn" href="profile.html">个人中心签到</a>
    <span style="font-size:13px;color:var(--text-secondary);">投币请直接在帖子卡片上操作</span>
    <span style="margin-left:auto;font-size:12px;color:var(--text-secondary);" id="hudState"></span>
  </div>
  <div class="shop-layout">
    <div class="sidebar" id="catSide"><div class="sb-head">商品分类</div><div class="load-box"><span class="load-spinner"></span></div></div>
    <div class="main">
      <div class="section-title">商品兑换</div>
      <div id="shopGrid"><div class="load-box"><span class="load-spinner"></span><span class="load-text">商品加载中…</span></div></div>
    </div>
  </div>
</div>

<!-- 我的：积分明细+兑换记录 -->
<div class="wrap" id="meWrap" style="display:none;">
  <div class="section-title">我的记录</div>
  <div class="panel"><h3>积分明细</h3><div id="meLog"><div class="load-box"><span class="load-spinner"></span><span class="load-text">流水加载中…</span></div></div></div>
  <div class="panel"><h3>兑换记录</h3><div id="meOrders"><div class="load-box"><span class="load-spinner"></span><span class="load-text">记录加载中…</span></div></div></div>
</div>

<!-- 管理 -->
<div class="wrap" id="adWrap" style="display:none;">
  <div class="section-title">管理后台</div>
  <div class="panel">
    <h3>商品管理 <button class="btn" style="margin-left:8px;" onclick="showItemForm()">新增商品</button></h3>
    <div id="adItems"><div class="load-box"><span class="load-spinner"></span><span class="load-text">加载中…</span></div></div>
    <div id="itemForm" style="display:none;margin-top:16px;border-top:1px solid var(--border);padding-top:14px;">
      <div class="form-grid">
        <div><label>名称</label><input id="fName"></div>
        <div><label>分类</label><input id="fCategory" placeholder="如 物资 / 金币 / 增益 / 称号"></div>
        <div><label>描述（宣传介绍）</label><input id="fDesc"></div>
        <div><label>图标路径</label><input id="fIcon" placeholder="shop-icons/x.png"></div>
        <div><label>所需积分</label><input id="fPrice" type="number"></div>
        <div><label>类型</label><select id="fType"><option value="item">物资</option><option value="coin">金币</option><option value="buff">永久增益</option><option value="title">称号</option></select></div>
        <div><label>数量</label><input id="fQty" type="number"></div>
        <div><label>单位</label><input id="fUnit" placeholder="个"></div>
        <div><label>金币数量</label><input id="fCoin" type="number" placeholder="type=coin 时"></div>
        <div><label>库存（-1=无限）</label><input id="fStock" type="number" value="-1"></div>
        <div><label>限购周期</label><select id="fPeriod"><option value="day">每日</option><option value="week">每周</option><option value="month">每月</option><option value="lifetime">终身</option><option value="none">不限</option></select></div>
        <div><label>周期限购次数</label><input id="fPeriodLimit" type="number"></div>
        <div><label>终身限购次数</label><input id="fLifeLimit" type="number"></div>
        <div><label>排序</label><input id="fSort" type="number"></div>
      </div>
      <div style="margin-top:12px;display:flex;gap:10px;">
        <button class="btn primary" style="width:auto;" onclick="saveItem()">保存</button>
        <button class="btn" onclick="document.getElementById('itemForm').style.display='none'">取消</button>
      </div>
    </div>
  </div>
  <div class="panel">
    <h3>兑换码库存</h3>
    <div class="form-row" style="display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;">
      <div style="flex:1;min-width:200px;"><label>选择商品</label><select id="cdItemSel"></select></div>
      <button class="btn" onclick="loadCodes()">查看库存</button>
      <button class="btn primary" onclick="addCodesFor()">批量添加兑换码</button>
    </div>
    <div id="codesBox" style="margin-top:12px;"></div>
  </div>
  <div class="panel">
    <h3>积分发放</h3>
    <div class="form-row" style="display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;">
      <div style="flex:1;min-width:220px;"><label>用户邮箱</label><input id="ptEmail" placeholder="用户登录邮箱"></div>
      <div style="width:120px;"><label>增减积分</label><input id="ptDelta" type="number" placeholder="如 1000 / -500"></div>
      <div style="flex:1;min-width:180px;"><label>原因</label><input id="ptReason" placeholder="如 活动奖励"></div>
      <button class="btn primary" onclick="givePoints()">发放</button>
    </div>
  </div>
  <div class="panel">
    <h3>帖子管理（全部帖子）</h3>
    <div id="adPosts"><div class="load-box"><span class="load-spinner"></span><span class="load-text">加载中…</span></div></div>
  </div>
  <div class="panel">
    <h3>全部订单</h3>
    <div id="adOrders"><div class="load-box"><span class="load-spinner"></span><span class="load-text">加载中…</span></div></div>
  </div>
</div>

<!-- 兑换结果 -->
<div class="modal-mask" id="buyMask"><div class="modal"><h3>兑换成功</h3><div id="buyBody"></div><div class="m-actions"><button class="btn primary" style="width:auto;" onclick="closeMask('buyMask')">知道了</button></div></div></div>

<!-- 积分明细 -->
<div class="modal-mask" id="ptsMask"><div class="modal">
  <h3>我的积分</h3>
  <div style="display:flex;gap:14px;margin-bottom:14px;">
    <div style="flex:1;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:12px;text-align:center;"><div style="font-size:12px;color:var(--text-secondary);">当前积分</div><div id="pmPoints" style="font-size:24px;font-weight:800;color:var(--warn);">--</div></div>
    <div style="flex:1;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:12px;text-align:center;"><div style="font-size:12px;color:var(--text-secondary);">今日已投币</div><div id="pmGiven" style="font-size:24px;font-weight:800;">--</div></div>
  </div>
  <div style="font-size:14px;font-weight:600;margin-bottom:8px;">积分明细</div>
  <div id="pmLog" style="max-height:200px;overflow:auto;"><div class="load-box"><span class="load-spinner"></span></div></div>
  <div style="font-size:14px;font-weight:600;margin:14px 0 8px;">如何增加积分</div>
  <div id="pmWays"></div>
  <div class="m-actions"><button class="btn" onclick="closeMask('ptsMask')">关闭</button></div>
</div></div>

<!-- 赞助 -->
<div class="modal-mask" id="sponsorMask"><div class="modal"><h3>赞助感谢</h3><div id="sponsorBody"></div><div class="m-actions"><button class="btn" onclick="closeMask('sponsorMask')">关闭</button></div></div></div>

<div class="toast" id="toast"></div>
<script>
var API='https://theslowtidefk.pages.dev/api';
var ICON_BASE='https://theslowtide.pages.dev/';
var token=localStorage.getItem('tst_token')||'';
var email=localStorage.getItem('tst_email')||'';
var CAT='全部', ADMIN_ON=false, editingId=0, myName='';
var ALL_ITEMS=[], myPoints=0;

function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
function pTime(t){ if(!t) return ''; return String(t).replace('T',' ').slice(0,16); }
function fmt(n){ return Number(n||0).toLocaleString('zh-CN'); }
function toast(msg){ var t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._tm); t._tm=setTimeout(function(){ t.classList.remove('show'); },2200); }
function api(path,opt){ return fetch(API+path,opt).then(function(r){ return r.json().catch(function(){ return {}; }); }); }
function postJson(path,body){ return api(path,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify(body||{})}); }
function closeMask(id){ document.getElementById(id).classList.remove('show'); }
function themeInit(){ var t=localStorage.getItem('tst_theme')||'dark'; document.documentElement.setAttribute('data-theme',t); }

/* ===== 加载（并行提速） ===== */
function loadAll(){
  var meP=api('/me',{headers:{'Authorization':'Bearer '+token},cache:'no-store'});
  var stP=api('/shop/state',{headers:{'Authorization':'Bearer '+token},cache:'no-store'}).catch(function(){return null;});
  var itP=api('/shop/items',{headers:{'Authorization':'Bearer '+token},cache:'no-store'}).catch(function(){return null;});
  Promise.all([meP,stP,itP]).then(function(res){
    var d=res[0];
    if(!(d&&d.ok)){ document.getElementById('gateWrap').style.display='block'; return; }
    myName=d.nickname||email.split('@')[0];
    document.getElementById('mainWrap').style.display='block';
    document.getElementById('uName').style.display='';
    document.getElementById('uName').textContent=myName;
    document.getElementById('uBtn').style.display='';
    var st=res[1];
    if(st&&st.ok){ myPoints=st.points; document.getElementById('ptsNum').textContent=fmt(st.points); document.getElementById('hudState').textContent='连续签到 '+st.streak+' 天'; }
    var it=res[2];
    if(it&&it.ok){ ALL_ITEMS=(it.items||[]).filter(function(x){ return x.active!==0; }); renderSide(); renderItems(); }
  }).catch(function(){ document.getElementById('gateWrap').style.display='block'; });
}
function renderSide(){
  var cats=['全部'];
  ALL_ITEMS.forEach(function(it){ var c=(it.category||'物资'); if(cats.indexOf(c)<0) cats.push(c); });
  document.getElementById('catSide').innerHTML='<div class="sb-head">商品分类</div>'+cats.map(function(c){
    var n=c==='全部'?ALL_ITEMS.length:ALL_ITEMS.filter(function(x){return (x.category||'物资')===c;}).length;
    return '<button class="sb-item'+(c===CAT?' active':'')+'" data-cat="'+esc(c)+'">'+esc(c)+' <span style="font-size:12px;color:var(--text-secondary);">'+n+'</span></button>';
  }).join('');
  document.querySelectorAll('#catSide .sb-item').forEach(function(b){ b.onclick=function(){ CAT=b.getAttribute('data-cat'); renderSide(); renderItems(); }; });
}
function renderItems(){
  var box=document.getElementById('shopGrid');
  var items=CAT==='全部'?ALL_ITEMS:ALL_ITEMS.filter(function(x){ return (x.category||'物资')===CAT; });
  if(!items.length){ box.innerHTML='<div class="empty-hint">暂无商品</div>'; return; }
  var PERIOD={'day':'每日限购','week':'每周限购','month':'每月限购','lifetime':'终身限购'};
  box.innerHTML=items.map(function(it){
    var quota='';
    if(it.bought>=0){
      if(it.period==='lifetime') quota='终身限购 '+it.lifetime_limit+' 次，剩 '+it.bought+' 次';
      else quota=PERIOD[it.period]+' '+it.period_limit+' 次，剩 '+it.bought+' 次';
    }
    if(it.stock!=null&&it.stock>=0) quota+=(quota?'<br>':'')+'库存余 '+it.stock+'';
    if(it.type==='coin'&&it.coin_total>=0) quota+='<br>已累计兑换 '+fmt(it.coin_total)+' / 200000 金币';
    var soldout=it.bought===0;
    return '<div class="item"><img class="ic" src="'+(it.icon?ICON_BASE+it.icon:'')+'" alt="" onerror="this.style.visibility=\'hidden\'"><div class="nm">'+esc(it.name)+'</div><div class="ds">'+esc(it.desc||'')+'</div><div class="pr">'+fmt(it.price)+' 积分</div><div class="quota'+(soldout?' soldout':'')+'">'+quota+'</div><button class="btn primary" onclick="buyItem('+it.id+')" '+(soldout?'disabled':'')+'>兑换</button></div>';
  }).join('');
}
function buyItem(id){
  postJson('/shop/buy',{item_id:id}).then(function(d){
    if(d&&d.ok){
      document.getElementById('buyBody').innerHTML='<div style="text-align:center;padding:10px 0;">已兑换 <b>'+esc(d.name)+'</b>，扣除 '+fmt(d.points)+' 积分<br><br><div style="font-size:12px;color:var(--text-secondary);margin-bottom:6px;">兑换码（游戏内兑换用，仅可使用一次）：</div><div class="code" style="font-size:17px;padding:10px;background:var(--bg);border:1px solid var(--border);border-radius:8px;">'+esc(d.code||'无')+'</div></div>';
      document.getElementById('buyMask').classList.add('show');
      myPoints=d.points; document.getElementById('ptsNum').textContent=fmt(d.points);
      loadAll();
    }else if(d&&d.error==='no_stock'){ toast(d.msg||'库存不足'); }
    else if(d&&d.error==='limit'){ toast(d.msg||'限购次数已用完'); loadAll(); }
    else if(d&&d.error==='coin_total'){ toast(d.msg||'金币累计上限已达'); loadAll(); }
    else if(d&&d.error==='no_points'){ toast(d.msg||'积分不足'); }
    else toast((d&&d.msg)||'兑换失败');
  }).catch(function(){ toast('网络异常，请稍后再试'); });
}

/* ===== 管理 ===== */
function enterAdmin(){
  if(!ADMIN_ON){
    var p=prompt('请输入管理员密码：');
    if(p===null) return;
    if(!p){ toast('未输入密码'); return; }
    sessionStorage.setItem('tstShopAdmin',p); ADMIN_ON=true; toast('已进入管理');
  }
  document.getElementById('mainWrap').style.display='none';
  document.getElementById('meWrap').style.display='none';
  document.getElementById('adWrap').style.display='block';
  loadAdminAll();
}
function adminApi(body){ return api('/shop/admin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign({pw:sessionStorage.getItem('tstShopAdmin')||''},body||{}))}); }
function postAdmin(body){ return api('/posts/admin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign({pw:sessionStorage.getItem('tstShopAdmin')||''},body||{}))}); }
function loadAdminAll(){ if(!ADMIN_ON) return; loadAdminItems(); loadAdminPosts(); loadAdminOrders(); }
function loadAdminItems(){
  adminApi({action:'item_list'}).then(function(d){
    var box=document.getElementById('adItems');
    if(!(d&&d.items)){ box.innerHTML='<div class="empty-hint">加载失败</div>'; return; }
    var TYPE={'coin':'金币','item':'物资','buff':'增益','title':'称号'};
    box.innerHTML='<table class="table"><thead><tr><th>ID</th><th>名称</th><th>分类</th><th>价格</th><th>限购</th><th>库存</th><th>状态</th><th>操作</th></tr></thead><tbody>'+d.items.map(function(it){
      return '<tr><td>'+it.id+'</td><td>'+esc(it.name)+'</td><td>'+esc(it.category||'物资')+'</td><td>'+fmt(it.price)+'</td><td>'+(it.period==='lifetime'?'终身 '+it.lifetime_limit:'每'+(it.period==='day'?'日':it.period==='week'?'周':'月')+' '+it.period_limit)+' 次</td><td>'+(it.stock==null||it.stock<0?'无限':it.stock)+'</td><td>'+(it.active?'<span style="color:var(--ok);">上架</span>':'<span style="color:var(--text-secondary);">下架</span>')+'</td><td><button class="btn" onclick="editItem('+it.id+')">编辑</button> <button class="btn" onclick="toggleItem('+it.id+','+it.active+')">'+(it.active?'下架':'上架')+'</button> <button class="btn" onclick="addCodesFor('+it.id+',\''+esc(it.name).replace(/'/g,"\\'")+'\')">加码</button></td></tr>';
    }).join('')+'</tbody></table>';
  });
}
function showItemForm(){ document.getElementById('itemForm').style.display='block'; editingId=0; ['fName','fDesc','fIcon','fUnit'].forEach(function(i){ document.getElementById(i).value=''; }); document.getElementById('fCategory').value='物资'; document.getElementById('fPrice').value=''; document.getElementById('fType').value='item'; document.getElementById('fQty').value='1'; document.getElementById('fCoin').value=''; document.getElementById('fStock').value='-1'; document.getElementById('fPeriod').value='day'; document.getElementById('fPeriodLimit').value='1'; document.getElementById('fLifeLimit').value='0'; document.getElementById('fSort').value='0'; }
function editItem(id){
  adminApi({action:'item_list'}).then(function(d){
    var it=(d.items||[]).find(function(x){ return x.id===id; });
    if(!it) return;
    document.getElementById('itemForm').style.display='block'; editingId=id;
    document.getElementById('fName').value=it.name; document.getElementById('fCategory').value=it.category||'物资'; document.getElementById('fDesc').value=it.desc||''; document.getElementById('fIcon').value=it.icon||''; document.getElementById('fPrice').value=it.price; document.getElementById('fType').value=it.type; document.getElementById('fQty').value=it.qty; document.getElementById('fUnit').value=it.unit||''; document.getElementById('fCoin').value=it.coin_amount||''; document.getElementById('fStock').value=(it.stock==null?-1:it.stock); document.getElementById('fPeriod').value=it.period||'day'; document.getElementById('fPeriodLimit').value=it.period_limit||''; document.getElementById('fLifeLimit').value=it.lifetime_limit||''; document.getElementById('fSort').value=it.sort||'';
  });
}
function saveItem(){
  var body={name:document.getElementById('fName').value,category:document.getElementById('fCategory').value,desc:document.getElementById('fDesc').value,icon:document.getElementById('fIcon').value,price:Number(document.getElementById('fPrice').value)||0,type:document.getElementById('fType').value,qty:Number(document.getElementById('fQty').value)||1,unit:document.getElementById('fUnit').value,coin_amount:Number(document.getElementById('fCoin').value)||0,stock:Number(document.getElementById('fStock').value),period:document.getElementById('fPeriod').value,period_limit:Number(document.getElementById('fPeriodLimit').value)||0,lifetime_limit:Number(document.getElementById('fLifeLimit').value)||0,sort:Number(document.getElementById('fSort').value)||0};
  if(!body.name){ toast('名称必填'); return; }
  adminApi({action:editingId?'item_update':'item_add',id:editingId||undefined,name:body.name,category:body.category,desc:body.desc,icon:body.icon,price:body.price,type:body.type,qty:body.qty,unit:body.unit,coin_amount:body.coin_amount,stock:body.stock,period:body.period,period_limit:body.period_limit,lifetime_limit:body.lifetime_limit,sort:body.sort}).then(function(d){
    if(d&&d.ok){ toast('已保存'); document.getElementById('itemForm').style.display='none'; loadAdminItems(); }
    else toast('保存失败：'+(d&&d.error));
  });
}
function toggleItem(id,active){
  adminApi({action:'item_active',id:id,active:active?0:1}).then(function(d){ if(d&&d.ok){ toast('已更新'); loadAdminItems(); } });
}
function addCodesFor(id,name){
  var itemId=id||Number(document.getElementById('cdItemSel').value)||0;
  var nm=name||'该商品';
  if(!itemId){ toast('请先选择商品'); return; }
  var s=prompt('为「'+nm+'」批量添加兑换码（每行一个，最多 200 个）：\n\n输入兑换码或留空自动生成');
  if(s===null) return;
  var codes=[];
  if(s.trim()){ codes=s.split(/\r?\n/).map(function(x){return x.trim();}).filter(Boolean); }
  else { codes=autoGen(Number(prompt('生成数量（1~200）：','10'))||10); }
  adminApi({action:'codes_add',item_id:itemId,codes:codes}).then(function(d){ if(d&&d.ok){ toast('已添加 '+d.added+' 个'); loadCodes(); } else toast('添加失败'); });
}
function autoGen(n){ var chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; var out=[]; for(var i=0;i<n;i++){ var s=''; for(var j=0;j<12;j++) s+=chars[Math.floor(Math.random()*chars.length)]; out.push('TSTC-'+s); } return out; }
function loadCodes(){
  var itemId=Number(document.getElementById('cdItemSel').value)||0;
  if(!itemId) return;
  adminApi({action:'codes_list',item_id:itemId}).then(function(d){
    var box=document.getElementById('codesBox');
    if(!(d&&d.codes)){ box.innerHTML=''; return; }
    var used=d.codes.filter(function(c){ return c.used; }).length;
    box.innerHTML='<div style="font-size:12px;color:var(--text-secondary);margin-bottom:8px;">共 '+d.codes.length+' 个，已使用 '+used+' 个</div><table class="table"><thead><tr><th>ID</th><th>兑换码</th><th>状态</th><th>使用人</th><th>操作</th></tr></thead><tbody>'+d.codes.map(function(c){
      var st=c.used?'<span style="color:var(--text-secondary);">已使用</span>':(c.disabled?'<span style="color:var(--danger);">已禁用</span>':'<span style="color:var(--ok);">可用</span>');
      return '<tr><td>'+c.id+'</td><td class="code">'+esc(c.code)+'</td><td>'+st+'</td><td>'+(c.used_by?esc(c.used_by):'-')+'</td><td>'+(c.used||c.disabled?'':'<button class="btn" onclick="disableCode('+c.id+')">禁用</button>')+'</td></tr>';
    }).join('')+'</tbody></table>';
  });
}
function disableCode(id){ adminApi({action:'codes_disable',id:id}).then(function(d){ if(d&&d.ok){ toast('已禁用'); loadCodes(); } }); }
function givePoints(){
  var email=document.getElementById('ptEmail').value.trim();
  var delta=Number(document.getElementById('ptDelta').value)||0;
  var reason=document.getElementById('ptReason').value.trim();
  if(!email||!delta){ toast('邮箱和积分必填'); return; }
  adminApi({action:'points_set',email:email,delta:delta,reason:reason||'admin'}).then(function(d){
    if(d&&d.ok){ toast('已发放，该用户当前积分 '+d.points); document.getElementById('ptEmail').value=''; document.getElementById('ptDelta').value=''; }
    else toast((d&&d.msg)||'发放失败');
  });
}
function loadAdminPosts(){
  postAdmin({action:'list_posts'}).then(function(d){
    var box=document.getElementById('adPosts');
    if(!(d&&d.posts)){ box.innerHTML='<div class="empty-hint">加载失败</div>'; return; }
    if(!d.posts.length){ box.innerHTML='<div class="empty-hint">暂无帖子</div>'; return; }
    box.innerHTML='<div style="max-height:520px;overflow:auto;"><table class="table"><thead><tr><th>ID</th><th>作者</th><th>内容</th><th>评论</th><th>时间</th><th>操作</th></tr></thead><tbody>'+d.posts.map(function(p){
      return '<tr><td>'+p.id+'</td><td>'+esc(p.name||'')+'</td><td style="max-width:280px;word-break:break-word;">'+esc((p.content||'').slice(0,60))+'</td><td>'+p.comments+'</td><td>'+pTime(p.created_at)+'</td><td><button class="btn" onclick="adminPin('+p.id+')">'+(p.pinned?'取消置顶':'置顶')+'</button> <button class="btn danger" onclick="adminDelPost('+p.id+')">删除</button></td></tr>';
    }).join('')+'</tbody></table></div>';
  });
}
function adminPin(id){ postAdmin({action:'pin',id:id}).then(function(d){ if(d&&d.ok){ toast('已更新'); loadAdminPosts(); } }); }
function adminDelPost(id){ if(!confirm('确定删除该帖子吗？其评论、点赞、收藏、投币将一并删除。')) return; postAdmin({action:'del_post',id:id}).then(function(d){ if(d&&d.ok){ toast('已删除'); loadAdminPosts(); } }); }
function loadAdminOrders(){
  adminApi({action:'orders_list'}).then(function(d){
    var box=document.getElementById('adOrders');
    if(!(d&&d.orders)){ box.innerHTML=''; return; }
    if(!d.orders.length){ box.innerHTML='<div class="empty-hint">暂无订单</div>'; return; }
    box.innerHTML='<div style="max-height:400px;overflow:auto;"><table class="table"><thead><tr><th>时间</th><th>用户</th><th>商品</th><th>积分</th><th>兑换码</th></tr></thead><tbody>'+d.orders.map(function(o){
      return '<tr><td>'+pTime(o.created_at)+'</td><td>'+esc(o.email)+'</td><td>'+esc(o.name)+'</td><td>'+fmt(o.price)+'</td><td class="code">'+(o.code?esc(o.code):'-')+'</td></tr>';
    }).join('')+'</tbody></table></div>';
  });
}
