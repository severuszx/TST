<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 - The Slow Tide</title>
<meta name="description" content="The Slow Tide 玩家登录：邮箱验证码登录，登录后可发布动态、绑定游戏 UID。">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif;background:#f6f7f9;color:#1f2937;min-height:100vh;display:flex;flex-direction:column;}
a{color:#4a6cf7;text-decoration:none;}
a:hover{text-decoration:underline;}

/* ===== 顶部品牌栏 ===== */
.topbar{background:#0f1115;padding:14px 20px;display:flex;align-items:center;gap:12px;}
.topbar .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#7ea2ff,#4a6cf7);color:#fff;font-size:15px;font-weight:800;display:flex;align-items:center;justify-content:center;}
.topbar .name{color:#fff;font-size:16px;font-weight:700;}
.topbar .sub{color:#8a94a6;font-size:11px;letter-spacing:1px;margin-left:2px;}
.topbar .home{margin-left:auto;color:#c7cdd8;font-size:13px;padding:7px 14px;border:1px solid #2a2f3a;border-radius:8px;transition:background .2s;}
.topbar .home:hover{background:#1a1f2a;text-decoration:none;}

/* ===== 登录卡片 ===== */
.wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:32px 16px;}
.card{width:100%;max-width:440px;background:#fff;border:1px solid #e5e7eb;border-radius:16px;padding:32px 30px;box-shadow:0 10px 34px rgba(15,20,35,.06);}
.card h1{font-size:22px;font-weight:700;margin-bottom:6px;}
.card .desc{font-size:13px;color:#6b7280;margin-bottom:24px;line-height:1.7;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:13px;font-weight:600;color:#374151;margin-bottom:6px;}
.input{width:100%;padding:11px 13px;border:1px solid #d1d5db;border-radius:10px;font-size:15px;color:#1f2937;background:#fff;outline:none;transition:border-color .2s,box-shadow .2s;font-family:inherit;}
.input:focus{border-color:#4a6cf7;box-shadow:0 0 0 3px rgba(74,108,247,.14);}
.input.err{border-color:#ef4444;animation:shake .4s;}
@keyframes shake{0%,100%{transform:translateX(0);}20%{transform:translateX(-5px);}40%{transform:translateX(5px);}60%{transform:translateX(-4px);}80%{transform:translateX(4px);}}
.hint{font-size:12px;color:#9ca3af;margin-top:5px;line-height:1.5;}
.hint.err{color:#ef4444;}
.hint.ok{color:#16a34a;}
.row{display:flex;gap:8px;}
.row .input{flex:1;min-width:0;}

/* ===== 按钮 ===== */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 16px;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;transition:background .2s,opacity .2s;font-family:inherit;white-space:nowrap;}
.btn:disabled{cursor:not-allowed;opacity:.65;}
.btn-primary{background:#4a6cf7;color:#fff;width:100%;}
.btn-primary:not(:disabled):hover{background:#3b5bd9;}
.btn-send{background:#eef1fb;color:#4a6cf7;border:1px solid #d5ddfa;font-size:13px;font-weight:600;padding:10px 13px;border-radius:10px;cursor:pointer;white-space:nowrap;transition:background .2s;min-width:108px;justify-content:center;}
.btn-send:not(:disabled):hover{background:#e3e9fa;}
.btn-send:disabled{opacity:.7;cursor:not-allowed;}

/* ===== spinner 加载动画 ===== */
.spinner{width:17px;height:17px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0;}
.spinner.dark{border-color:rgba(74,108,247,.25);border-top-color:#4a6cf7;}
@keyframes spin{to{transform:rotate(360deg);}}

/* ===== 协议勾选 ===== */
.agree{display:flex;align-items:flex-start;gap:8px;font-size:12.5px;color:#6b7280;margin:4px 0 16px;line-height:1.6;}
.agree input{width:15px;height:15px;margin-top:2px;accent-color:#4a6cf7;flex-shrink:0;}
.agree.err{color:#ef4444;}

/* ===== toast ===== */
#toast{position:fixed;top:18px;left:50%;transform:translateX(-50%) translateY(-70px);background:#111827;color:#fff;font-size:14px;padding:11px 22px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.18);opacity:0;transition:transform .35s cubic-bezier(.34,1.56,.64,1),opacity .3s;z-index:999;pointer-events:none;}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1;}
#toast.ok{background:#16a34a;}
#toast.err{background:#dc2626;}

/* ===== 帮助/状态 ===== */
.foot{text-align:center;font-size:12.5px;color:#9ca3af;margin-top:20px;line-height:2;}
.foot a{color:#4a6cf7;}

/* ===== 协议弹窗 ===== */
.modal-mask{position:fixed;inset:0;background:rgba(15,20,35,.5);display:none;align-items:center;justify-content:center;z-index:1000;padding:20px;}
.modal-mask.show{display:flex;}
.modal{background:#fff;border-radius:14px;max-width:560px;width:100%;max-height:70vh;overflow-y:auto;padding:26px 28px;}
.modal h3{font-size:17px;margin-bottom:12px;}
.modal p{font-size:13.5px;color:#4b5563;line-height:1.9;margin-bottom:12px;}
.modal .close{margin-top:14px;width:100%;padding:10px;border:none;border-radius:10px;background:#f3f4f6;color:#374151;font-size:14px;font-weight:600;cursor:pointer;}
.modal .close:hover{background:#e5e7eb;}

@media (max-width:520px){
  .card{padding:24px 18px;}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">TST</div>
  <div>
    <div class="name">The Slow Tide</div>
    <div class="sub">PLAYER SIGN IN</div>
  </div>
  <a class="home" href="https://theslowtide.pages.dev/">← 返回官网</a>
</div>

<div class="wrap">
  <div class="card">
    <h1>登录 / 注册</h1>
    <div class="desc">输入邮箱获取验证码即可登录，新邮箱将自动注册。<br>登录后可发布动态、绑定游戏 UID。</div>

    <div class="field">
      <label for="email">邮箱</label>
      <input class="input" id="email" type="email" maxlength="100" placeholder="name@example.com" autocomplete="email" inputmode="email">
      <div class="hint" id="emailHint">用于接收验证码，不会公开。</div>
    </div>

    <div class="field">
      <label for="code">验证码</label>
      <div class="row">
        <input class="input" id="code" type="text" maxlength="6" placeholder="6 位数字" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code">
        <button class="btn-send" id="sendBtn">获取验证码</button>
      </div>
      <div class="hint" id="codeHint">6 位数字，10 分钟内有效。</div>
    </div>

    <div class="agree" id="agreeRow">
      <input type="checkbox" id="agree">
      <span>我已阅读并同意 <a href="javascript:;" onclick="showModal('terms')">《用户协议》</a> 与 <a href="javascript:;" onclick="showModal('privacy')">《隐私政策》</a>，并同意使用邮箱作为登录账号。</span>
    </div>

    <button class="btn btn-primary" id="loginBtn">登录 / 注册</button>
    <div class="hint" id="loginHint" style="margin-top:10px;"></div>

    <div class="foot">
      <a href="javascript:;" onclick="showModal('help')">遇到问题？查看帮助</a><br>
      登录状态保持 30 天 · 邮箱仅用于登录验证
    </div>
  </div>
</div>

<div id="toast"></div>

<div class="modal-mask" id="modalMask">
  <div class="modal">
    <h3 id="modalTitle"></h3>
    <div id="modalBody"></div>
    <button class="close" onclick="closeModal()">知道了</button>
  </div>
</div>

<script>
(function(){
  var AUTH='https://theslowtidefk.pages.dev/api';
  var $=function(id){return document.getElementById(id);};
  var emailEl=$('email'),codeEl=$('code'),sendBtn=$('sendBtn'),loginBtn=$('loginBtn');
  var emailHint=$('emailHint'),codeHint=$('codeHint'),loginHint=$('loginHint');

  // 自动聚焦邮箱
  emailEl.focus();

  // ===== 邮箱即时校验（失焦 + 输入）=====
  var EMAIL_RE=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  function checkEmail(){
    var v=emailEl.value.trim();
    if(!v){ emailEl.classList.remove('err'); emailHint.className='hint'; emailHint.textContent='用于接收验证码，不会公开。'; return false; }
    if(!EMAIL_RE.test(v)){
      emailEl.classList.add('err');
      emailHint.className='hint err'; emailHint.textContent='邮箱格式不正确，请检查后重新输入。';
      return false;
    }
    emailEl.classList.remove('err');
    emailHint.className='hint ok'; emailHint.textContent='邮箱格式正确。';
    return true;
  }
  emailEl.addEventListener('blur',checkEmail);
  emailEl.addEventListener('input',function(){ if(EMAIL_RE.test(emailEl.value.trim())){ emailEl.classList.remove('err'); emailHint.className='hint ok'; emailHint.textContent='邮箱格式正确。'; } });

  // ===== 验证码输入（仅数字）=====
  codeEl.addEventListener('input',function(){ codeEl.value=codeEl.value.replace(/\D/g,'').slice(0,6); codeEl.classList.remove('err'); codeHint.className='hint'; codeHint.textContent='6 位数字，10 分钟内有效。'; });

  function toast(msg,type){
    var t=$('toast');
    t.textContent=msg;
    t.className=type==='ok'?'show ok':(type==='err'?'show err':'show');
    clearTimeout(t._timer);
    t._timer=setTimeout(function(){ t.className=''; },2600);
  }

  // ===== 发送验证码：倒计时 + spinner =====
  sendBtn.addEventListener('click',function(){
    if(!checkEmail()){ toast('请输入正确的邮箱','err'); emailEl.focus(); return; }
    if(!$('agree').checked){ $('agreeRow').classList.add('err'); toast('请先勾选同意用户协议与隐私政策','err'); return; }
    $('agreeRow').classList.remove('err');
    var btn=sendBtn;
    btn.disabled=true;
    btn.innerHTML='<span class="spinner dark"></span>发送中';
    fetch(AUTH+'/send-code',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:emailEl.value.trim()})})
      .then(function(r){return r.json();})
      .then(function(d){
        if(d&&d.ok){
          toast(d.msg||'验证码已发送，请查收邮箱','ok');
          codeHint.className='hint ok'; codeHint.textContent='验证码已发送至 '+emailEl.value.trim()+'，10 分钟内有效。';
          startCountdown(btn);
        }else{
          btn.disabled=false; btn.innerHTML='获取验证码';
          toast((d&&d.msg)||'发送失败，请稍后再试','err');
        }
      })
      .catch(function(){
        btn.disabled=false; btn.innerHTML='获取验证码';
        toast('网络异常，请稍后再试','err');
      });
  });

  // ===== 60 秒倒计时 =====
  function startCountdown(btn){
    var left=60;
    btn.innerHTML=left+'s 后重发';
    btn._timer=setInterval(function(){
      left--;
      if(left<=0){ clearInterval(btn._timer); btn.disabled=false; btn.innerHTML='获取验证码'; }
      else btn.innerHTML=left+'s 后重发';
    },1000);
  }

  // ===== 登录：spinner + 协议校验 =====
  loginBtn.addEventListener('click',doLogin);
  codeEl.addEventListener('keydown',function(e){ if(e.key==='Enter') doLogin(); });

  function doLogin(){
    var email=emailEl.value.trim(),code=codeEl.value.trim();
    if(!checkEmail()){ emailEl.focus(); return; }
    if(!code){ codeEl.classList.add('err'); codeHint.className='hint err'; codeHint.textContent='请输入 6 位验证码。'; codeEl.focus(); return; }
    if(!$('agree').checked){ $('agreeRow').classList.add('err'); toast('请先勾选同意用户协议与隐私政策','err'); return; }
    $('agreeRow').classList.remove('err');
    loginBtn.disabled=true;
    loginBtn.innerHTML='<span class="spinner"></span>登录中…';
    fetch(AUTH+'/verify',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email,code:code})})
      .then(function(r){return r.json();})
      .then(function(d){
        loginBtn.disabled=false; loginBtn.innerHTML='登录 / 注册';
        if(d&&d.ok){
          if(d.token)localStorage.setItem('tst_token',d.token);
          if(d.email)localStorage.setItem('tst_email',d.email);
          if(d.uid)localStorage.setItem('tst_uid',d.uid);
          toast('登录成功，欢迎回来','ok');
          setTimeout(function(){ location.href='profile.html'; },900);
        }else{
          toast((d&&d.msg)||'登录失败','err');
          codeEl.classList.add('err');
          codeEl.select();
        }
      })
      .catch(function(){
        loginBtn.disabled=false; loginBtn.innerHTML='登录 / 注册';
        toast('网络异常，请稍后再试','err');
      });
  }
})();

// ===== 协议/帮助弹窗 =====
var TEXTS={
  terms:'<p>《用户协议》</p><p>1. 本账号用于访问 The Slow Tide 官网的登录、发布动态、绑定游戏 UID 等功能。</p><p>2. 使用本服务即代表您为完全民事行为能力人，或已获得监护人同意。</p><p>3. 禁止利用账号进行刷屏、辱骂、发布违规内容等影响社区秩序的行为，违者将被限制或封禁相关功能。</p><p>4. 账号仅限本人使用，因出借、转让账号导致的损失由用户自行承担。</p><p>5. The Slow Tide 保留对本协议的解释与修改权利，修改后将在官网公示。</p>',
  privacy:'<p>《隐私政策》</p><p>1. 我们仅收集登录所必需的邮箱地址，用于发送验证码与识别账号身份。</p><p>2. 邮箱不会公开显示、不会出售或提供给任何第三方。</p><p>3. 您绑定的游戏 UID 仅用于服务器身份关联，用于发帖身份标识。</p><p>4. 数据存储于安全环境，您可随时联系管理员注销账号。</p><p>5. 开始使用本服务即视为您同意本政策。</p>',
  help:'<p>常见问题</p><p>1. <b>收不到验证码？</b> 请检查垃圾箱；确认邮箱填写正确；若 60 秒内多次点击会被限频，请稍等再试。</p><p>2. <b>验证码错误/过期？</b> 验证码 10 分钟内有效且一次性使用，请重新获取。</p><p>3. <b>连续输错被锁定？</b> 同一邮箱连续 5 次输错会锁定 10 分钟，请稍后再试。</p><p>4. 仍无法解决？请联系管理员：QQ 交流群 <b>833470853</b>。</p>'
};
function showModal(k){
  document.getElementById('modalTitle').textContent=k==='help'?'帮助中心':(k==='terms'?'用户协议':'隐私政策');
  document.getElementById('modalBody').innerHTML=TEXTS[k];
  document.getElementById('modalMask').classList.add('show');
}
function closeModal(){ document.getElementById('modalMask').classList.remove('show'); }
document.getElementById('modalMask').addEventListener('click',function(e){ if(e.target===this) closeModal(); });
</script>
</body>
</html>
